</style></head><body><header><b>▦ LED<span>PLANNER</span></b><small>HDRG Creative Partner · Mapping & Cable</small><div class="actions"><button onclick="backup()">Simpan file</button><button onclick="document.getElementById('import').click()">Buka file</button><button class="primary" onclick="exportTab()">↓ Export</button></div></header><input id="import" type="file" accept=".json" hidden><nav id="nav"></nav><main><div class="title"><input id="projectName" aria-label="Nama proyek" onchange="state.name=this.value;persist()"><span class="tag" id="saveStatus">Lokal · autosave</span></div><div id="stats" class="stats"></div><div id="app"></div></main><div id="toast" role="status"></div><script>
'use strict';
const $=id=>document.getElementById(id),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const profiles=[{name:'P3.91 · 50 × 50 cm',w:500,h:500,pw:128,ph:128},{name:'P3.91 · 50 × 100 cm',w:500,h:1000,pw:128,ph:256},{name:'P2.60 · 50 × 50 cm',w:500,h:500,pw:192,ph:192},{name:'P4.81 · 50 × 50 cm',w:500,h:500,pw:104,ph:104},{name:'P4.81 · 50 × 100 cm',w:500,h:1000,pw:104,ph:208}];
const colors=['#b6f376','#61d4f2','#ffad75','#cb9bff','#ff86b6','#f5d97c'];const makeScreen=()=>({id:crypto.randomUUID(),name:'Main LED',profile:0,w:500,h:500,pw:128,ph:128,cols:6,rows:4,ix:0,iy:0,ox:0,oy:0,output:1,axis:'vertical',corner:'tl'});
const initial=()=>({version:3,name:'LED mapping project',inputW:1920,inputH:1080,dataArea:8,powerArea:10,dataLead:20,powerLead:10,dataJumper:1,powerJumper:1,outputs:[{id:1,name:'Output 1',brand:'NovaStar',width:1920,height:1080,ports:8,pixelLimit:0}],screens:[makeScreen()]});
let state=initial(),tab='Mapping',mode='input',cableMode='data',activeOutput=1,selected=state.screens[0].id,zoom=1,drag=null;
function valid(v){const num=(n,min,max,int=false)=>typeof n==='number'&&Number.isFinite(n)&&n>=min&&n<=max&&(!int||Number.isInteger(n));return v&&v.version===3&&typeof v.name==='string'&&num(v.inputW,1,32768,true)&&num(v.inputH,1,32768,true)&&['dataArea','powerArea'].every(k=>num(v[k],.01,10000))&&['dataLead','powerLead','dataJumper','powerJumper'].every(k=>num(v[k],0,1000))&&Array.isArray(v.outputs)&&v.outputs.length>0&&v.outputs.length<=16&&v.outputs.every(o=>num(o.id,1,100000,true)&&typeof o.name==='string'&&typeof o.brand==='string'&&num(o.width,1,32768,true)&&num(o.height,1,32768,true)&&num(o.ports,1,128,true)&&num(o.pixelLimit,0,1e8,true))&&new Set(v.outputs.map(o=>o.id)).size===v.outputs.length&&Array.isArray(v.screens)&&v.screens.length<=50&&new Set(v.screens.map(s=>s.id)).size===v.screens.length&&v.screens.every(s=>typeof s.id==='string'&&/^[a-zA-Z0-9-]{1,100}$/.test(s.id)&&typeof s.name==='string'&&num(s.profile,-1,profiles.length-1,true)&&['w','h','pw','ph'].every(k=>num(s[k],1,10000,true))&&['cols','rows'].every(k=>num(s[k],1,40,true))&&['ix','iy','ox','oy'].every(k=>num(s[k],0,100000,true))&&v.outputs.some(o=>o.id===s.output)&&['vertical','horizontal'].includes(s.axis)&&['tl','tr','bl','br'].includes(s.corner))}
function migrate(v){if(valid(v))return v;if(v?.version!==1||!Array.isArray(v.screens)||v.screens.length>50)throw Error('Format proyek tidak didukung');let n=initial();n.name=typeof v.name==='string'?v.name:n.name;let old=Array.isArray(v.processors)?v.processors:[];if(old.length)n.outputs=old.slice(0,16).map((o,i)=>({id:i+1,name:String(o.name||'Output '+(i+1)),brand:String(o.brand||'Lainnya'),width:1920,height:1080,ports:o.ports||8,pixelLimit:o.limit||0}));n.screens=v.screens.map((s,i)=>({...makeScreen(),id:'migrated-'+i,name:String(s.name||'Layar '+(i+1)),profile:-1,...Object.fromEntries(['w','h','pw','ph','cols','rows'].map(k=>[k,s[k]])),ix:Math.max(0,Math.round(s.x/s.w*s.pw)),iy:Math.max(0,Math.round(s.y/s.h*s.ph)),ox:0,oy:i*100,axis:s.axis||'vertical',output:Math.max(1,old.findIndex(o=>o.id===s.processor)+1)}));if(!valid(n))throw Error('Proyek lama tidak valid');return n}
try{let raw=localStorage.getItem('ledplanner-v3');if(raw)state=migrate(JSON.parse(raw));else{let old=localStorage.getItem('ledplanner-v1');if(old)state=migrate(JSON.parse(old))}selected=state.screens[0]?.id;activeOutput=state.outputs[0].id}catch{setTimeout(()=>notify('Data tersimpan tidak dapat dibaca. File lama tetap dipertahankan.'),300)}
function persist(){try{localStorage.setItem('ledplanner-v3',JSON.stringify(state));$('saveStatus').textContent='Lokal · tersimpan'}catch{$('saveStatus').textContent='Gagal simpan · unduh file';notify('Penyimpanan lokal penuh/tidak tersedia. Pilih Simpan file.')}}
function notify(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4000)}
const current=()=>state.screens.find(s=>s.id===selected),area=s=>s.w*s.h/1e6,sw=s=>s.cols*s.pw,sh=s=>s.rows*s.ph;
function order(s){let a=[];if(s.axis==='vertical'){for(let x=0;x<s.cols;x++)for(let j=0;j<s.rows;j++)a.push([x,x%2?s.rows-1-j:j])}else for(let y=0;y<s.rows;y++)for(let j=0;j<s.cols;j++)a.push([y%2?s.cols-1-j:j,y]);return a.map(([x,y])=>[s.corner.includes('r')?s.cols-1-x:x,s.corner.includes('b')?s.rows-1-y:y])}
function paths(s,type){let max=Math.floor((type==='data'?state.dataArea:state.powerArea)/area(s)+1e-9);if(type==='data'){let o=state.outputs.find(o=>o.id===s.output);if(o.pixelLimit)max=Math.min(max,Math.floor(o.pixelLimit/(s.pw*s.ph)))}if(max<1)return [];let a=order(s),n=Math.ceil(a.length/max),base=Math.floor(a.length/n),extra=a.length%n,start=0;return Array.from({length:n},(_,i)=>{let len=base+(i<extra?1:0),r=a.slice(start,start+len);start+=len;return r})}
function allPaths(type){let offsets={},all=[];for(let s of state.screens){let key=type==='data'?s.output:0;offsets[key]??=0;for(let cells of paths(s,type))all.push({screen:s,output:s.output,number:++offsets[key],cells})}return all}
function totals(){let n=state.screens.reduce((a,s)=>a+s.cols*s.rows,0),d=allPaths('data').length,p=allPaths('power').length;return {n,d,p,area:state.screens.reduce((a,s)=>a+s.cols*s.rows*area(s),0),dataLinks:state.screens.filter(s=>paths(s,'data').length).reduce((a,s)=>a+s.cols*s.rows-paths(s,'data').length,0),powerLinks:state.screens.filter(s=>paths(s,'power').length).reduce((a,s)=>a+s.cols*s.rows-paths(s,'power').length,0)}}
function problems(){let a=[];for(let s of state.screens){if(!paths(s,'data').length)a.push(`${s.name}: satu kabinet melebihi batas data.`);if(!paths(s,'power').length)a.push(`${s.name}: satu kabinet melebihi batas power.`);let o=state.outputs.find(o=>o.id===s.output);if(s.ix+sw(s)>state.inputW||s.iy+sh(s)>state.inputH)a.push(`${s.name}: keluar dari input canvas.`);if(s.ox+sw(s)>o.width||s.oy+sh(s)>o.height)a.push(`${s.name}: keluar dari ${o.name}.`)}for(let o of state.outputs){let n=allPaths('data').filter(r=>r.output===o.id).length;if(n>o.ports)a.push(`${o.name}: membutuhkan ${n} port; tersedia ${o.ports}.`)}for(let i=0;i<state.screens.length;i++)for(let j=i+1;j<state.screens.length;j++){let s=state.screens[i],t=state.screens[j];if(s.output===t.output&&s.ox<t.ox+sw(t)&&s.ox+sw(s)>t.ox&&s.oy<t.oy+sh(t)&&s.oy+sh(s)>t.oy)a.push(`${s.name} dan ${t.name}: output bertumpuk.`)}return a}
function input(label,key,value,scope='screen',step=1){return `<label>${label}<input type="number" step="${step}" value="${value}" onchange="edit('${scope}','${key}',Number(this.value))"></label>`}
function edit(scope,k,v){let obj=scope==='screen'?current():scope==='output'?state.outputs.find(o=>o.id===activeOutput):state;if(!obj)return;let old=obj[k];obj[k]=v;if(scope==='screen'&&['w','h','pw','ph'].includes(k))obj.profile=-1;if(!valid(state)){obj[k]=old;notify('Nilai di luar batas yang didukung.')}persist();render()}
function applyProfile(i){let s=current();if(i===-1){s.profile=-1}else{let a=profiles[i];Object.assign(s,{profile:i,w:a.w,h:a.h,pw:a.pw,ph:a.ph})}persist();render()}
function addScreen(){if(state.screens.length>=50)return notify('Maksimal 50 layar');let s=makeScreen();s.name='LED '+(state.screens.length+1);s.output=activeOutput;s.ix=100*state.screens.length;s.ox=100*state.screens.length;state.screens.push(s);selected=s.id;persist();render()}
function removeScreen(){if(!confirm('Hapus layar ini?'))return;state.screens=state.screens.filter(s=>s.id!==selected);selected=state.screens[0]?.id;persist();render()}
function addOutput(){if(state.outputs.length>=16)return;let id=Math.max(...state.outputs.map(o=>o.id))+1;state.outputs.push({id,name:'Output '+id,brand:'NovaStar',width:1920,height:1080,ports:8,pixelLimit:0});activeOutput=id;persist();render()}
function render(){let t=totals();$('projectName').value=state.name;$('nav').innerHTML=['Mapping','Kabel','Export'].map((n,i)=>`<button class="${n===tab?'active':''}" onclick="tab='${n}';render()">0${i+1} &nbsp; ${n}</button>`).join('');$('stats').innerHTML=[['Kabinet',t.n],['Luas LED',t.area.toFixed(2)+' m²'],['Port data',t.d],['Power loop',t.p]].map(([a,b])=>`<div class="stat"><small>${a}</small><strong>${b}</strong></div>`).join('');if(tab==='Export')renderExport();else renderEditor()}
function renderEditor(){let s=current(),o=state.outputs.find(o=>o.id===activeOutput);$('app').innerHTML=`<div class="workspace"><aside class="panel editor"><h2>Susunan layar</h2><div class="screens">${state.screens.map(s=>`<button class="${s.id===selected?'active':''}" onclick="selected='${s.id}';activeOutput=${s.output};render()">${escapeHTML(s.name)} <small>· ${s.cols} × ${s.rows}</small></button>`).join('')}</div><button class="primary" onclick="addScreen()">+ Tambah layar</button>${s?`<label>Nama layar<input value="${escapeHTML(s.name)}" onchange="edit('screen','name',this.value)"></label><label>Kabinet<select onchange="applyProfile(Number(this.value))">${profiles.map((p,i)=>`<option value="${i}" ${s.profile===i?'selected':''}>${p.name}</option>`).join('')}<option value="-1" ${s.profile===-1?'selected':''}>Custom</option></select></label><div class="pair">${input('Kolom','cols',s.cols)}${input('Baris','rows',s.rows)}</div><p class="helper">${s.cols*s.w/1000} × ${s.rows*s.h/1000} m · ${sw(s)} × ${sh(s)} px<br>Preset contoh; cocokkan resolusi dengan kabinet asli.</p><details ${s.profile===-1?'open':''}><summary>Spesifikasi kabinet</summary><div class="pair">${input('Lebar mm','w',s.w)}${input('Tinggi mm','h',s.h)}${input('Lebar px','pw',s.pw)}${input('Tinggi px','ph',s.ph)}</div></details><hr><label>Output tujuan<select onchange="edit('screen','output',Number(this.value))">${state.outputs.map(o=>`<option value="${o.id}" ${s.output===o.id?'selected':''}>${escapeHTML(o.name)}</option>`).join('')}</select></label>${tab==='Mapping'?`<div class="pair">${input('Input X px','ix',s.ix)}${input('Input Y px','iy',s.iy)}${input('Output X px','ox',s.ox)}${input('Output Y px','oy',s.oy)}</div>`:`<label>Pola kabel<select onchange="edit('screen','axis',this.value)"><option value="vertical" ${s.axis==='vertical'?'selected':''}>Zig-zag vertikal</option><option value="horizontal" ${s.axis==='horizontal'?'selected':''}>Zig-zag horizontal</option></select></label><label>Mulai dari<select onchange="edit('screen','corner',this.value)">${[['tl','Kiri atas'],['tr','Kanan atas'],['bl','Kiri bawah'],['br','Kanan bawah']].map(([v,n])=>`<option value="${v}" ${s.corner===v?'selected':''}>${n}</option>`).join('')}</select></label>`}<button class="danger" onclick="removeScreen()">Hapus layar</button>`:''}<hr>${tab==='Kabel'?`<h2>Batas per jalur</h2><div class="pair">${input('Data m² / port','dataArea',state.dataArea,'project',.25)}${input('Power m² / loop','powerArea',state.powerArea,'project',.25)}</div><p class="helper">Batas operasional manual. Power belum diverifikasi terhadap rating listrik.</p>`:''}<details><summary>Canvas & output</summary><div class="pair">${input('Input lebar px','inputW',state.inputW,'project')}${input('Input tinggi px','inputH',state.inputH,'project')}</div><label>Edit output<select onchange="activeOutput=Number(this.value);render()">${outputOptions()}</select></label><label>Nama output<input value="${escapeHTML(o.name)}" onchange="edit('output','name',this.value)"></label><label>Merek<select onchange="edit('output','brand',this.value)">${['NovaStar','Colorlight','Linsn','Huidu','Brompton','Lainnya'].map(b=>`<option ${o.brand===b?'selected':''}>${b}</option>`).join('')}</select></label><div class="pair">${input('Output lebar px','width',o.width,'output')}${input('Output tinggi px','height',o.height,'output')}${input('Jumlah port','ports',o.ports,'output')}${input('Batas px/port (0=?)','pixelLimit',o.pixelLimit,'output')}</div><button onclick="addOutput()">+ Output/prosesor</button></details></aside><section class="panel canvas-panel"><div class="canvas-bar">${tab==='Mapping'?`<button class="${mode==='input'?'active':''}" onclick="mode='input';render()">Input map</button><button class="${mode==='output'?'active':''}" onclick="mode='output';render()">Output map</button>`:`<button class="${cableMode==='data'?'active':''}" onclick="cableMode='data';render()">Data</button><button class="${cableMode==='power'?'active':''}" onclick="cableMode='power';render()">Power</button>`}<select aria-label="Output canvas" onchange="activeOutput=Number(this.value);render()">${outputOptions()}</select><span class="spacer"></span><button aria-label="Perkecil" onclick="zoom=Math.max(1,zoom-.5);resizeCanvas()">−</button><button onclick="zoom=1;resizeCanvas()">Fit</button><button aria-label="Perbesar" onclick="zoom=Math.min(4,zoom+.5);resizeCanvas()">+</button></div><div class="canvas-scroll" id="stage"></div><div class="bottom">${tab==='Mapping'?'Geser layar atau isi koordinat px. Input dan output dapat diatur terpisah.':'Tampak depan · titik besar = awal jalur · panah mengikuti urutan kabel.'}</div></section></div>${tab==='Kabel'?cableSummary():''}${warningsHTML()}`;drawCanvas()}
function outputOptions(){return state.outputs.map(o=>`<option value="${o.id}" ${o.id===activeOutput?'selected':''}>${escapeHTML(o.name)}</option>`).join('')}
function warningsHTML(){let a=problems();return a.length?`<div class="notice"><b>Periksa mapping</b><ul>${a.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></div>`:''}
function canvasSVG(view=tab==='Kabel'?'cable':mode){let o=state.outputs.find(o=>o.id===activeOutput),w=view==='input'?state.inputW:o.width,h=view==='input'?state.inputH:o.height,list=view==='input'?state.screens:state.screens.filter(s=>s.output===activeOutput);let pad=40,W=w+pad*2,H=h+pad*2;return `<svg xmlns="http://www.w3.org/2000/svg" id="canvas" width="${W}" height="${H}" viewBox="-${pad} -${pad} ${W} ${H}"><defs><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" stroke="#23334a" stroke-width="1" fill="none"/></pattern>${colors.map((c,i)=>`<marker id="arr${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="${c}"/></marker>`).join('')}</defs><rect x="-${pad}" y="-${pad}" width="${W}" height="${H}" fill="#0c1320"/><rect width="${w}" height="${h}" fill="url(#grid)" stroke="#5c708b"/><text x="0" y="-15" fill="#a7bfd8" font-size="14">${view==='input'?'INPUT':escapeHTML(o.name)} · ${w} × ${h} px</text>${list.map(s=>{let x=view==='input'?s.ix:s.ox,y=view==='input'?s.iy:s.oy,idx=state.screens.indexOf(s),routes=allPaths(cableMode).filter(r=>r.screen.id===s.id),label=new Map();routes.forEach(r=>r.cells.forEach(([c,d],i)=>label.set(c+','+d,{number:r.number,i})));return `<g data-screen="${s.id}" transform="translate(${x} ${y})" style="cursor:${view==='cable'?'default':'move'}"><rect width="${sw(s)}" height="${sh(s)}" fill="${colors[idx%6]}" fill-opacity=".12" stroke="${selected===s.id?'#d2ffa2':colors[idx%6]}" stroke-width="3"/><text x="6" y="-7" fill="${colors[idx%6]}" font-size="14">${escapeHTML(s.name)}</text>${Array.from({length:s.rows},(_,r)=>Array.from({length:s.cols},(_,c)=>{let a=label.get(c+','+r);return `<rect x="${c*s.pw}" y="${r*s.ph}" width="${s.pw}" height="${s.ph}" fill="none" stroke="#567087" stroke-width=".7"/><text x="${(c+.5)*s.pw}" y="${(r+.4)*s.ph}" text-anchor="middle" fill="#d4e2f2" font-size="${Math.max(6,Math.min(s.pw,s.ph)*.15)}">${view==='cable'?(a?`${cableMode==='data'?'D':'P'}${a.number}.${a.i+1}`:'!'):r*s.cols+c+1}</text>`}).join('')).join('')}${view==='cable'?routes.map(r=>{let color=(r.number-1)%6;return r.cells.map(([c,d],i)=>{let cx=(c+.5)*s.pw,cy=(d+.7)*s.ph;if(!i)return `<circle cx="${cx}" cy="${cy}" r="5" fill="${colors[color]}"/>`;let prev=r.cells[i-1];return `<line x1="${(prev[0]+.5)*s.pw}" y1="${(prev[1]+.7)*s.ph}" x2="${cx}" y2="${cy}" stroke="${colors[color]}" stroke-width="2" marker-end="url(#arr${color})"/>`}).join('')}).join(''):''}</g>`}).join('')}</svg>`}
function drawCanvas(){$('stage').innerHTML=canvasSVG();resizeCanvas();let svg=$('canvas');svg.onpointerdown=e=>{let g=e.target.closest('[data-screen]');if(!g)return;selected=g.dataset.screen;if(tab==='Kabel'){render();return}let q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),s=current();drag={x:q.x-(mode==='input'?s.ix:s.ox),y:q.y-(mode==='input'?s.iy:s.oy)};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;let q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),s=current(),x=Math.min(100000,Math.max(0,Math.round(q.x-drag.x))),y=Math.min(100000,Math.max(0,Math.round(q.y-drag.y)));if(mode==='input'){s.ix=x;s.iy=y}else{s.ox=x;s.oy=y}svg.querySelector(`[data-screen="${s.id}"]`).setAttribute('transform',`translate(${x} ${y})`)};svg.onpointerup=svg.onpointercancel=()=>{if(drag){drag=null;persist();render()}}}
function resizeCanvas(){if($('canvas')){$('canvas').style.width=zoom*100+'%';$('canvas').style.height=(innerWidth<700?310:470)*zoom+'px'}}
function cableSummary(){let t=totals();return `<section class="panel sub"><h2>Kebutuhan kabel</h2><div class="table-wrap"><table><thead><tr><th>Jenis</th><th>Jumlah</th><th>Panjang per kabel</th><th>Total perkiraan</th></tr></thead><tbody>${[['Data utama',t.d,'dataLead'],['Jumper data',t.dataLinks,'dataJumper'],['Power utama',t.p,'powerLead'],['Jumper power',t.powerLinks,'powerJumper']].map(([n,a,k])=>`<tr><td>${n}</td><td>${a} kabel</td><td><input aria-label="Panjang ${n}" type="number" min="0" step=".5" value="${state[k]}" onchange="edit('project','${k}',Number(this.value))" style="width:85px"> m</td><td>${(a*state[k]).toFixed(1)} m</td></tr>`).join('')}</tbody></table></div><p class="helper">Satu kabel utama per jalur; jumper = kabinet − jalur. Tiap layar memakai jalur tersendiri. Panjang berdasarkan isian, belum mencakup spare, redundansi, atau rute fisik venue. Asumsi satu receiving card per kabinet.</p></section>`}
function exportTab(){tab='Export';render()}
function renderExport(){$('app').innerHTML=`<div class="grid2"><section class="panel"><h2>Resolume Arena</h2><p class="helper">Input crop dan posisi output diekspor sebagai rectangular slices. Setiap output menjadi virtual screen.</p><button class="primary" onclick="exportXML()">↓ Resolume XML · Beta</button><div class="notice">Struktur mengikuti contoh preset Arena 7. Belum diuji impor langsung di Arena. Setelah impor, pilih display fisik dan periksa semua slice sebelum show.</div></section><section class="panel"><h2>NovaLCT / Colorlight / lainnya</h2><p class="helper">Tabel koneksi berisi output/prosesor, port, urutan kabinet, dan koordinat piksel pada output.</p><button onclick="connectionCSV()">↓ Tabel koneksi CSV</button><div class="notice">CSV adalah panduan input manual. Ekspor native NovaLCT .scr / receiving-card .rcfgx dan file native Colorlight belum tersedia; memerlukan contoh file serta verifikasi software tujuan.</div></section><section class="panel"><h2>Mapping & diagram</h2><label>Output diagram<select onchange="activeOutput=Number(this.value);render()">${outputOptions()}</select></label><div class="export-buttons"><button onclick="exportSVG('input')">Input SVG</button><button onclick="exportSVG('output')">Output SVG</button><button onclick="cableMode='data';exportSVG('cable')">Data SVG</button><button onclick="cableMode='power';exportSVG('cable')">Power SVG</button><button onclick="exportPNG('input')">Input PNG</button><button onclick="exportPNG('output')">Output PNG</button></div></section><section class="panel"><h2>Kebutuhan kabel & proyek</h2><div class="export-buttons"><button onclick="cablesCSV()">Kebutuhan kabel CSV</button><button onclick="backup()">Simpan proyek JSON</button><button onclick="tab='Kabel';render();window.print()">Cetak kabel / PDF</button></div><p class="helper">Buka kembali file JSON untuk melanjutkan mapping. Proyek versi sebelumnya dapat diimpor; field crew/aset tidak dipakai dalam editor sederhana ini.</p></section></div>${warningsHTML()}${cableSummary()}`}
function download(content,name,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backup(){download(JSON.stringify(state,null,2),'ledplanner-project.json','application/json')}
function csvText(rows){let quote=v=>'"'+String(/^[=+@-]/.test(String(v))?"'"+v:v).replace(/"/g,'""')+'"';return '\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n')}
function connectionRows(){let rows=[['Output','Brand','Screen','Port','ChainOrder','Column','Row','OutputX_px','OutputY_px','Width_px','Height_px','PowerLoop']];let powerMap=new Map();for(let r of allPaths('power'))for(let [x,y] of r.cells)powerMap.set(r.screen.id+':'+x+':'+y,r.number);for(let r of allPaths('data')){let s=r.screen,o=state.outputs.find(o=>o.id===r.output);r.cells.forEach(([x,y],i)=>rows.push([o.name,o.brand,s.name,r.number,i+1,x+1,y+1,s.ox+x*s.pw,s.oy+y*s.ph,s.pw,s.ph,powerMap.get(s.id+':'+x+':'+y)??'unassigned']))}return rows}
function connectionCSV(){if(state.screens.some(s=>!paths(s,'data').length))return notify('Perbaiki batas data: ada kabinet tanpa jalur.');download(csvText(connectionRows()),'ledplanner-manual-connection.csv','text/csv;charset=utf-8')}
function cablesCSV(){let t=totals();download(csvText([['Jenis','Jumlah','Panjang per kabel m','Total m'],['Data utama',t.d,state.dataLead,t.d*state.dataLead],['Jumper data',t.dataLinks,state.dataJumper,t.dataLinks*state.dataJumper],['Power utama',t.p,state.powerLead,t.p*state.powerLead],['Jumper power',t.powerLinks,state.powerJumper,t.powerLinks*state.powerJumper]]),'ledplanner-cables.csv','text/csv;charset=utf-8')}
function exportSVG(view){download(canvasSVG(view),'ledplanner-'+(view==='cable'?cableMode:view)+'.svg','image/svg+xml')}
function exportPNG(view){let s=canvasSVG(view),o=state.outputs.find(o=>o.id===activeOutput),w=view==='input'?state.inputW:o.width,h=view==='input'?state.inputH:o.height;let scale=Math.min(1,4096/(w+80),4096/(h+80)),c=document.createElement('canvas');c.width=Math.round((w+80)*scale);c.height=Math.round((h+80)*scale);let img=new Image(),url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));img.onload=()=>{c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(b)download(b,'ledplanner-'+view+'.png','image/png')});URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);notify('Gagal membuat PNG')};img.src=url}
function vertices(x,y,w,h){return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]].map(([a,b])=>`<v x="${a}" y="${b}"/>`).join('')}
function resolumeXML(){let id=Date.now(),param=(n,t,v)=>`<Param name="${n}" T="${t}" value="${escapeHTML(v)}"/>`;return `<?xml version="1.0" encoding="UTF-8"?>\n<XmlState name="${escapeHTML(state.name)}"><versionInfo name="Resolume Arena" majorVersion="7" minorVersion="27" microVersion="0" revision="14395"/><ScreenSetup name="ScreenSetup"><Params name="ScreenSetupParams"/><CurrentCompositionTextureSize width="${state.inputW}" height="${state.inputH}"/><screens>${state.outputs.filter(o=>state.screens.some(s=>s.output===o.id)).map(o=>`<Screen name="${escapeHTML(o.name)}" uniqueId="${id++}"><Params name="Params">${param('Name','STRING',o.name)}${param('Enabled','BOOL',1)}${param('Hidden','BOOL',0)}</Params><layers>${state.screens.filter(s=>s.output===o.id).map(s=>{let out=vertices(s.ox,s.oy,sw(s),sh(s)),mesh='';for(let y=0;y<4;y++)for(let x=0;x<4;x++)mesh+=`<v x="${s.ox+sw(s)*x/3}" y="${s.oy+sh(s)*y/3}"/>`;return `<Slice uniqueId="${id++}"><Params name="Common">${param('Name','STRING',s.name)}${param('Enabled','BOOL',1)}</Params><Params name="Input"><ParamChoice name="Input Source" default="0:1" value="0:1" storeChoices="0"/></Params><Params name="Output">${param('Flip','UINT8',0)}</Params><InputRect orientation="0">${vertices(s.ix,s.iy,sw(s),sh(s))}</InputRect><OutputRect orientation="0">${out}</OutputRect><Warper><Params name="Warper"><ParamChoice name="Point Mode" default="PM_LINEAR" value="PM_LINEAR" storeChoices="0"/>${param('Flip','UINT8',0)}</Params><BezierWarper controlWidth="4" controlHeight="4"><vertices>${mesh}</vertices></BezierWarper><Homography><src>${out}</src><dst>${out}</dst></Homography></Warper></Slice>`}).join('')}</layers><OutputDevice><OutputDeviceVirtual name="${escapeHTML(o.name)}" deviceId="VirtualLEDPlanner${o.id}" width="${o.width}" height="${o.height}"/></OutputDevice></Screen>`).join('')}</screens></ScreenSetup></XmlState>`}
function exportXML(){if(!state.screens.length)return notify('Tambahkan layar terlebih dahulu.');let a=problems().filter(x=>x.includes('canvas')||x.includes('keluar')||x.includes('bertumpuk'));if(a.length)return notify('Perbaiki batas canvas atau overlap output sebelum export XML.');download(resolumeXML(),'LEDPlanner-Resolume-BETA.xml','application/xml');notify('XML Beta diekspor. Uji di Arena dan pilih output display fisik.')}
$('import').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>2e6)throw Error('Maksimal 2 MB');let p=migrate(JSON.parse(await f.text()));if(!confirm('Ganti proyek aktif? Simpan file terlebih dahulu jika diperlukan.'))return;state=p;selected=p.screens[0]?.id;activeOutput=p.outputs[0].id;persist();render()}catch(err){notify('Gagal impor: '+err.message)}finally{e.target.value=''}};
render();
</script></body></html>
