function renderEditor(){let s=current(),o=state.outputs.find(o=>o.id===activeOutput);$('app').innerHTML=`<div class="workspace"><aside class="panel editor"><h2>Susunan layar</h2><div class="screens">${state.screens.map(s=>`<button class="${s.id===selected?'active':''}" onclick="selected='${s.id}';activeOutput=${s.output};render()">${escapeHTML(s.name)} <small>· ${s.cols} × ${s.rows}</small></button>`).join('')}</div><button class="primary" onclick="addScreen()">+ Tambah layar</button>${s?`<label>Nama layar<input value="${escapeHTML(s.name)}" onchange="edit('screen','name',this.value)"></label><label>Kabinet<select onchange="applyProfile(Number(this.value))">${profiles.map((p,i)=>`<option value="${i}" ${s.profile===i?'selected':''}>${p.name}</option>`).join('')}<option value="-1" ${s.profile===-1?'selected':''}>Custom</option></select></label><div class="pair">${input('Kolom','cols',s.cols)}${input('Baris','rows',s.rows)}</div><p class="helper">${s.cols*s.w/1000} × ${s.rows*s.h/1000} m · ${sw(s)} × ${sh(s)} px<br>Preset contoh; cocokkan resolusi dengan kabinet asli.</p><details ${s.profile===-1?'open':''}><summary>Spesifikasi kabinet</summary><div class="pair">${input('Lebar mm','w',s.w)}${input('Tinggi mm','h',s.h)}${input('Lebar px','pw',s.pw)}${input('Tinggi px','ph',s.ph)}</div></details><hr><label>Output tujuan<select onchange="edit('screen','output',Number(this.value))">${state.outputs.map(o=>`<option value="${o.id}" ${s.output===o.id?'selected':''}>${escapeHTML(o.name)}</option>`).join('')}</select></label>${tab==='Mapping'?`<div class="pair">${input('Input X px','ix',s.ix)}${input('Input Y px','iy',s.iy)}${input('Output X px','ox',s.ox)}${input('Output Y px','oy',s.oy)}</div>`:`<label>Pola kabel<select onchange="edit('screen','axis',this.value)"><option value="vertical" ${s.axis==='vertical'?'selected':''}>Zig-zag vertikal</option><option value="horizontal" ${s.axis==='horizontal'?'selected':''}>Zig-zag horizontal</option></select></label><label>Mulai dari<select onchange="edit('screen','corner',this.value)">${[['tl','Kiri atas'],['tr','Kanan atas'],['bl','Kiri bawah'],['br','Kanan bawah']].map(([v,n])=>`<option value="${v}" ${s.corner===v?'selected':''}>${n}</option>`).join('')}</select></label>`}<button class="danger" onclick="removeScreen()">Hapus layar</button>`:''}<hr>${tab==='Kabel'?`<h2>Batas per jalur</h2><div class="pair">${input('Data m² / port','dataArea',state.dataArea,'project',.25)}${input('Power m² / loop','powerArea',state.powerArea,'project',.25)}</div><p class="helper">Batas operasional manual. Power belum diverifikasi terhadap rating listrik.</p>`:''}<details><summary>Canvas & output</summary><div class="pair">${input('Input lebar px','inputW',state.inputW,'project')}${input('Input tinggi px','inputH',state.inputH,'project')}</div><label>Edit output<select onchange="activeOutput=Number(this.value);render()">${outputOptions()}</select></label><label>Nama output<input value="${escapeHTML(o.name)}" onchange="edit('output','name',this.value)"></label><label>Merek<select onchange="edit('output','brand',this.value)">${['NovaStar','Colorlight','Linsn','Huidu','Brompton','Lainnya'].map(b=>`<option ${o.brand===b?'selected':''}>${b}</option>`).join('')}</select></label><div class="pair">${input('Output lebar px','width',o.width,'output')}${input('Output tinggi px','height',o.height,'output')}${input('Jumlah port','ports',o.ports,'output')}${input('Batas px/port (0=?)','pixelLimit',o.pixelLimit,'output')}</div><button onclick="addOutput()">+ Output/prosesor</button></details></aside><section class="panel canvas-panel"><div class="canvas-bar">${tab==='Mapping'?`<button class="${mode==='input'?'active':''}" onclick="mode='input';render()">Input map</button><button class="${mode==='output'?'active':''}" onclick="mode='output';render()">Output map</button>`:`<button class="${cableMode==='data'?'active':''}" onclick="cableMode='data';render()">Data</button><button class="${cableMode==='power'?'active':''}" onclick="cableMode='power';render()">Power</button>`}<select aria-label="Output canvas" onchange="activeOutput=Number(this.value);render()">${outputOptions()}</select><span class="spacer"></span><button aria-label="Perkecil" onclick="zoom=Math.max(1,zoom-.5);resizeCanvas()">−</button><button onclick="zoom=1;resizeCanvas()">Fit</button><button aria-label="Perbesar" onclick="zoom=Math.min(4,zoom+.5);resizeCanvas()">+</button></div><div class="canvas-scroll" id="stage"></div><div class="bottom">${tab==='Mapping'?'Geser layar atau isi koordinat px. Input dan output dapat diatur terpisah.':'Tampak depan · titik besar = awal jalur · panah mengikuti urutan kabel.'}</div></section></div>${tab==='Kabel'?cableSummary():''}${warningsHTML()}`;drawCanvas()}
function outputOptions(){return state.outputs.map(o=>`<option value="${o.id}" ${o.id===activeOutput?'selected':''}>${escapeHTML(o.name)}</option>`).join('')}
function warningsHTML(){let a=problems();return a.length?`<div class="notice"><b>Periksa mapping</b><ul>${a.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></div>`:''}
function canvasSVG(view=tab==='Kabel'?'cable':mode){let o=state.outputs.find(o=>o.id===activeOutput),w=view==='input'?state.inputW:o.width,h=view==='input'?state.inputH:o.height,list=view==='input'?state.screens:state.screens.filter(s=>s.output===activeOutput);let pad=40,W=w+pad*2,H=h+pad*2;return `<svg xmlns="http://www.w3.org/2000/svg" id="canvas" width="${W}" height="${H}" viewBox="-${pad} -${pad} ${W} ${H}"><defs><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" stroke="#23334a" stroke-width="1" fill="none"/></pattern>${colors.map((c,i)=>`<marker id="arr${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="${c}"/></marker>`).join('')}</defs><rect id="canvasBackground" x="-${pad}" y="-${pad}" width="${W}" height="${H}" fill="#0c1320"/><rect id="canvasExtent" width="${w}" height="${h}" fill="url(#grid)" stroke="#5c708b"/><text id="canvasCaption" x="0" y="-15" fill="#a7bfd8" font-size="14">${view==='input'?'INPUT':escapeHTML(o.name)} · ${w} × ${h} px</text>${list.map(s=>{let x=view==='input'?s.ix:s.ox,y=view==='input'?s.iy:s.oy,idx=state.screens.indexOf(s),routes=allPaths(cableMode).filter(r=>r.screen.id===s.id),label=new Map();routes.forEach(r=>r.cells.forEach(([c,d],i)=>label.set(c+','+d,{number:r.number,i})));return `<g data-screen="${s.id}" transform="translate(${x} ${y})" style="cursor:${view==='cable'?'default':'move'}"><rect width="${sw(s)}" height="${sh(s)}" fill="${colors[idx%6]}" fill-opacity=".12" stroke="${selected===s.id?'#d2ffa2':colors[idx%6]}" stroke-width="3"/><text x="6" y="-7" fill="${colors[idx%6]}" font-size="14">${escapeHTML(s.name)}</text>${Array.from({length:s.rows},(_,r)=>Array.from({length:s.cols},(_,c)=>{let a=label.get(c+','+r);return `<rect x="${c*s.pw}" y="${r*s.ph}" width="${s.pw}" height="${s.ph}" fill="none" stroke="#567087" stroke-width=".7"/><text x="${(c+.5)*s.pw}" y="${(r+.4)*s.ph}" text-anchor="middle" fill="#d4e2f2" font-size="${Math.max(6,Math.min(s.pw,s.ph)*.15)}">${view==='cable'?(a?`${cableMode==='data'?'D':'P'}${a.number}.${a.i+1}`:'!'):r*s.cols+c+1}</text>`}).join('')).join('')}${view==='cable'?routes.map(r=>{let color=(r.number-1)%6;return r.cells.map(([c,d],i)=>{let cx=(c+.5)*s.pw,cy=(d+.7)*s.ph;if(!i)return `<circle cx="${cx}" cy="${cy}" r="5" fill="${colors[color]}"/>`;let prev=r.cells[i-1];return `<line x1="${(prev[0]+.5)*s.pw}" y1="${(prev[1]+.7)*s.ph}" x2="${cx}" y2="${cy}" stroke="${colors[color]}" stroke-width="2" marker-end="url(#arr${color})"/>`}).join('')}).join(''):''}</g>`}).join('')}</svg>`}
function drawCanvas(){$('stage').innerHTML=canvasSVG();resizeCanvas();let svg=$('canvas');svg.onpointerdown=e=>{let g=e.target.closest('[data-screen]');if(!g)return;selected=g.dataset.screen;if(tab==='Kabel'){render();return}let q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),s=current();drag={x:q.x-(mode==='input'?s.ix:s.ox),y:q.y-(mode==='input'?s.iy:s.oy)};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;let q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),s=current(),x=Math.min(100000,Math.max(0,Math.round(q.x-drag.x))),y=Math.min(100000,Math.max(0,Math.round(q.y-drag.y)));if(mode==='input'){s.ix=x;s.iy=y}else{s.ox=x;s.oy=y}svg.querySelector(`[data-screen="${s.id}"]`).setAttribute('transform',`translate(${x} ${y})`)};svg.onpointerup=svg.onpointercancel=()=>{if(drag){drag=null;persist();render()}}}
function resizeCanvas(){if($('canvas')){$('canvas').style.width=zoom*100+'%';$('canvas').style.height=(innerWidth<700?310:470)*zoom+'px'}}
function cableSummary(){let t=totals();return `<section class="panel sub"><h2>Kebutuhan kabel</h2><div class="table-wrap"><table><thead><tr><th>Jenis</th><th>Jumlah</th><th>Panjang per kabel</th><th>Total perkiraan</th></tr></thead><tbody>${[['Data utama',t.d,'dataLead'],['Jumper data',t.dataLinks,'dataJumper'],['Power utama',t.p,'powerLead'],['Jumper power',t.powerLinks,'powerJumper']].map(([n,a,k])=>`<tr><td>${n}</td><td>${a} kabel</td><td><input aria-label="Panjang ${n}" type="number" min="0" step=".5" value="${state[k]}" onchange="edit('project','${k}',Number(this.value))" style="width:85px"> m</td><td>${(a*state[k]).toFixed(1)} m</td></tr>`).join('')}</tbody></table></div><p class="helper">Satu kabel utama per jalur; jumper = kabinet − jalur. Tiap layar memakai jalur tersendiri. Panjang berdasarkan isian, belum mencakup spare, redundansi, atau rute fisik venue. Asumsi satu receiving card per kabinet.</p></section>`}
function exportTab(){tab='Export';render()}
function renderExport(){$('app').innerHTML=`<div class="grid2"><section class="panel"><h2>Resolume Arena</h2><p class="helper">Input crop dan posisi output diekspor sebagai rectangular slices. Setiap output menjadi virtual screen.</p><button class="primary" onclick="exportXML()">↓ Resolume XML · Beta</button><div class="notice">Struktur mengikuti contoh preset Arena 7. Belum diuji impor langsung di Arena. Setelah impor, pilih display fisik dan periksa semua slice sebelum show.</div></section><section class="panel"><h2>Mapping & diagram</h2><label>Output diagram<select onchange="activeOutput=Number(this.value);render()">${outputOptions()}</select></label><p class="helper">PNG 1:1 · Input ${state.inputW} × ${state.inputH} px · Output ${state.outputs.find(o=>o.id===activeOutput).width} × ${state.outputs.find(o=>o.id===activeOutput).height} px. Area kosong hitam, tanpa margin editor.</p><label>Logo test pattern (opsional)<input id="testLogoFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="loadTestLogo(this.files[0])"></label><div id="testLogoStatus" role="status" aria-live="polite">${testLogoFeedback()}</div><p class="helper">Checkerboard, crosshair, lingkaran, koordinat, nama dan resolusi layar. Logo maksimal 500 KB.</p><div class="export-buttons"><button class="primary" onclick="exportPNG('input')">Input Map PNG</button><button class="primary" onclick="exportPNG('output')">Output Map PNG</button><button onclick="exportPNG('input',true)">Input Mask PNG</button><button onclick="exportPNG('output',true)">Output Mask PNG</button></div><p class="helper">Mask: area LED putih, area kosong hitam. XML tetap tersedia secara terpisah.</p><details><summary>Diagram kabel PNG</summary><div class="export-buttons"><button onclick="cableMode='data';exportPNG('cable')">Data PNG</button><button onclick="cableMode='power';exportPNG('cable')">Power PNG</button></div></details></section><section class="panel"><h2>PDF & proyek</h2><label>Tampak routing kabel<select onchange="state.pdfRoutingView=this.value;persist()">${[['front','Depan'],['rear','Belakang · untuk teknisi'],['both','Depan dan belakang']].map(([v,n])=>`<option value="${v}" ${(state.pdfRoutingView||'both')===v?'selected':''}>${n}</option>`).join('')}</select></label><p class="helper">Belakang: kiri-kanan dicerminkan, nomor tetap terbaca. Latar amber membedakannya dari tampak depan; warna port tetap sama.</p><p class="helper">PDF satu halaman panjang: input, output terpilih, routing data/power, dan rekap kebutuhan kabel. Logo HDRG kecil di bagian atas. Margin kiri-kanan konsisten untuk diagram dan rekap.</p><div class="export-buttons"><button onclick="backup()">Simpan proyek JSON</button><button class="primary" onclick="exportPDF()">↓ PDF sesuai pilihan</button><button onclick="exportPDF('rear')">↓ PDF teknisi · belakang</button><button onclick="exportPDF('both')">↓ PDF depan + belakang</button></div><p class="helper">Buka kembali file JSON untuk melanjutkan mapping. Proyek versi sebelumnya dapat diimpor; field crew/aset tidak dipakai dalam editor sederhana ini.</p></section></div>${warningsHTML()}${cableSummary()}`}
function download(content,name,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backup(){download(JSON.stringify(state,null,2),'ledplanner-project.json','application/json')}
function exportSVG(view){download(canvasSVG(view),'ledplanner-'+(view==='cable'?cableMode:view)+'.svg','image/svg+xml')}
let testLogoUpload=0;
function testLogoFeedback(){return state.testLogo?`<div class="test-logo-card"><div class="test-logo-thumb"><img src="${state.testLogo}" alt="Preview logo test pattern"></div><div class="test-logo-info"><strong>✓ Logo aktif</strong><span>${escapeHTML(typeof state.testLogoName==='string'?state.testLogoName:'Logo tersimpan')}</span><p>Logo akan tampil pada Input Map PNG, Output Map PNG, dan mapping PDF.</p><button type="button" onclick="removeTestLogo()">Hapus logo</button></div></div>`:'<p class="helper">Belum ada logo. Pilih gambar untuk melihat preview di sini.</p>'}
function removeTestLogo(){testLogoUpload++;delete state.testLogo;delete state.testLogoName;persist();render();notify('Logo test pattern dihapus')}
async function loadTestLogo(file){if(!file)return;const token=++testLogoUpload,status=$('testLogoStatus');const message=text=>{if(status)status.textContent=text;notify(text)};if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>500*1024){message('Gunakan PNG/JPG/WebP maksimal 500 KB. Logo sebelumnya tetap digunakan.');return}if(status){status.textContent='Memuat preview logo…';status.setAttribute('aria-busy','true')}try{let data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});await new Promise((resolve,reject)=>{let img=new Image();img.onload=resolve;img.onerror=reject;img.src=data});if(token!==testLogoUpload)return;state.testLogo=data;state.testLogoName=file.name;persist();render();notify('Logo test pattern berhasil ditambahkan')}catch{if(token===testLogoUpload)message('Gambar tidak dapat dibaca. Silakan pilih file lain.')}finally{if(status)status.removeAttribute('aria-busy')}}
function testPatternSVG(view,w,h){const list=view==='input'?state.screens:state.screens.filter(s=>s.output===activeOutput);return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="#000000"/>${list.map((s,i)=>{let W=sw(s),H=sh(s),x=view==='input'?s.ix:s.ox,y=view==='input'?s.iy:s.oy,tile=Math.max(4,Math.min(s.pw,s.ph)/4),font=Math.max(8,Math.min(W,H)*.026),title=font*1.25,boxW=Math.min(W*.8,Math.max(s.name.length*title*.62,W*.18)),boxH=font*2.8,cx=W/2,cy=H/2,r=Math.min(W,H)/2-2;return `<defs><pattern id="check${i}" width="${tile*2}" height="${tile*2}" patternUnits="userSpaceOnUse"><rect width="${tile*2}" height="${tile*2}" fill="${s.color}"/><path d="M0 0h${tile}v${tile}H0Z M${tile} ${tile}h${tile}v${tile}h-${tile}Z" fill="#000000" fill-opacity=".45"/><path d="M0 0H${tile*2}V${tile*2}H0Z M${tile} 0V${tile*2} M0 ${tile}H${tile*2}" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width=".5"/></pattern><clipPath id="screenclip${i}"><rect width="${W}" height="${H}"/></clipPath></defs><g transform="translate(${x} ${y})${view==='input'?` rotate(${s.angle||0} ${cx} ${cy})`:''}" clip-path="url(#screenclip${i})"><rect width="${W}" height="${H}" fill="url(#check${i})"/>${state.testLogo?`<image href="${state.testLogo}" x="${W*.15}" y="${H*.05}" width="${W*.7}" height="${H*.9}" preserveAspectRatio="xMidYMid meet"/>`:''}<path d="M0 0L${W} ${H}M${W} 0L0 ${H}M${cx} 0V${H}M0 ${cy}H${W}" fill="none" stroke="#ffffff" stroke-opacity=".65" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#ffffff" stroke-opacity=".65" stroke-width="1.5"/><rect x=".75" y=".75" width="${Math.max(0,W-1.5)}" height="${Math.max(0,H-1.5)}" fill="none" stroke="#ffffff" stroke-width="1.5"/><text x="5" y="${font+3}" fill="#ffffff" font-family="Arial,sans-serif" font-size="${font}">${x},${y}</text><rect x="${cx-boxW/2}" y="${cy-boxH/2}" width="${boxW}" height="${boxH}" fill="#000000" stroke="#ffffff" stroke-width="1"/><text x="${cx}" y="${cy-font*.12}" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="${title}" textLength="${Math.min(boxW-8,s.name.length*title*.62)}" lengthAdjust="spacingAndGlyphs">${escapeHTML(s.name)}</text><text x="${cx}" y="${cy+font}" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="${font*.75}">${W} × ${H}</text></g>`}).join('')}</svg>`}
function highContrastCableSVG(svg){return svg.replace(/fill="#[0-9a-fA-F]{6}" fill-opacity="\.12"/g,'fill="#142033"').replaceAll('stroke="#567087" stroke-width=".7"','stroke="#71839b" stroke-width="1.3"').replace(/<text([^>]*?)fill="#d4e2f2" font-size="([0-9.]+)"/g,(_,attrs,size)=>`<text${attrs}fill="#ffffff" font-family="Arial,sans-serif" font-weight="700" font-size="${Number(size)*1.6}"`).replace(/<line ([^>]*?)stroke="(#[0-9a-fA-F]{6})" stroke-width="2" marker-end="([^"]+)"\/>/g,(_,attrs,color,marker)=>`<line ${attrs}stroke="#050a12" stroke-width="8" stroke-linecap="round"/><line ${attrs}stroke="${color}" stroke-width="4" stroke-linecap="round" marker-end="${marker}"/>`).replace(/r="5" fill="(#[0-9a-fA-F]{6})"/g,'r="8" fill="$1" stroke="#ffffff" stroke-width="2"')}
function pngSpec(view,mask=false){autoSize();const o=state.outputs.find(o=>o.id===activeOutput),w=view==='input'?state.inputW:o.width,h=view==='input'?state.inputH:o.height;if(w>16384||h>16384||w*h>67108864)throw Error('Canvas melebihi batas ekspor PNG (16.384 px per sisi / 64 megapiksel). Ukuran tidak diperkecil otomatis.');let root=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`,svg;if(mask){let list=view==='input'?state.screens:state.screens.filter(s=>s.output===activeOutput);svg=root+`<rect width="${w}" height="${h}" fill="#000000"/>`+list.map(s=>{let points=view==='input'?inputPoints(s):[[s.ox,s.oy],[s.ox+sw(s),s.oy],[s.ox+sw(s),s.oy+sh(s)],[s.ox,s.oy+sh(s)]];return `<polygon points="${points.map(p=>p.join(',')).join(' ')}" fill="#ffffff"/>`}).join('')+'</svg>'}else if(view!=='cable'){svg=testPatternSVG(view,w,h)}else{svg=canvasSVG(view,false).replace(/<svg\b[^>]*>/,root).replace(/<text id="canvasCaption"[^>]*>[\s\S]*?<\/text>/,'').replace(/<rect id="canvasBackground"[^>]*\/>/,`<rect width="${w}" height="${h}" fill="#000000"/>`).replace(/<rect id="canvasExtent"[^>]*\/>/,'').replaceAll('fill-opacity=".12"','fill-opacity="1"').replaceAll('stroke="#d2ffa2"','stroke="#567087"');if(view!=='cable')svg=svg.replaceAll('fill="#d4e2f2"','fill="#101720"');svg=svg.replaceAll('y="-7"','y="16"')}let suffix=view==='input'?'input':view==='output'?'output-'+o.id:cableMode+'-'+o.id;return {w,h,svg,name:'ledplanner-'+suffix+(mask?'-mask':'-map')+'-'+w+'x'+h+'.png'}}
