const colors=['#b6f376','#61d4f2','#ffad75','#cb9bff','#ff86b6','#f5d97c'];const makeScreen=()=>({id:crypto.randomUUID(),name:'Main LED',profile:0,w:500,h:500,pw:128,ph:128,cols:6,rows:4,ix:0,iy:0,ox:0,oy:0,output:1,axis:'vertical',corner:'tl'});

let state=initial(),tab='Mapping',mode='input',cableMode='data',activeOutput=1,selected=state.screens[0].id,zoom=1,drag=null;
function valid(v){const num=(n,min,max,int=false)=>typeof n==='number'&&Number.isFinite(n)&&n>=min&&n<=max&&(!int||Number.isInteger(n));return v&&v.version===3&&typeof v.name==='string'&&num(v.inputW,1,32768,true)&&num(v.inputH,1,32768,true)&&['dataArea','powerArea'].every(k=>num(v[k],.01,10000))&&['dataLead','powerLead','dataJumper','powerJumper'].every(k=>num(v[k],0,1000))&&Array.isArray(v.outputs)&&v.outputs.length>0&&v.outputs.length<=16&&v.outputs.every(o=>num(o.id,1,100000,true)&&typeof o.name==='string'&&typeof o.brand==='string'&&num(o.width,1,32768,true)&&num(o.height,1,32768,true)&&num(o.ports,1,128,true)&&num(o.pixelLimit,0,1e8,true))&&new Set(v.outputs.map(o=>o.id)).size===v.outputs.length&&Array.isArray(v.screens)&&v.screens.length<=50&&new Set(v.screens.map(s=>s.id)).size===v.screens.length&&extrasValid(v)&&v.screens.every(s=>typeof s.id==='string'&&/^[a-zA-Z0-9-]{1,100}$/.test(s.id)&&typeof s.name==='string'&&num(s.profile,-1,profiles.length-1,true)&&['w','h','pw','ph'].every(k=>num(s[k],1,10000,true))&&['cols','rows'].every(k=>num(s[k],1,40,true))&&['ix','iy','ox','oy'].every(k=>num(s[k],0,100000,true))&&v.outputs.some(o=>o.id===s.output)&&['vertical','horizontal'].includes(s.axis)&&['tl','tr','bl','br'].includes(s.corner))}
function migrate(v){if(valid(v))return v;if(v?.version!==1||!Array.isArray(v.screens)||v.screens.length>50)throw Error('Format proyek tidak didukung');let n=initial();n.name=typeof v.name==='string'?v.name:n.name;let old=Array.isArray(v.processors)?v.processors:[];if(old.length)n.outputs=old.slice(0,16).map((o,i)=>({id:i+1,name:String(o.name||'Output '+(i+1)),brand:String(o.brand||'Lainnya'),width:1920,height:1080,ports:o.ports||8,pixelLimit:o.limit||0}));n.screens=v.screens.map((s,i)=>({...makeScreen(),id:'migrated-'+i,name:String(s.name||'Layar '+(i+1)),profile:-1,...Object.fromEntries(['w','h','pw','ph','cols','rows'].map(k=>[k,s[k]])),ix:Math.max(0,Math.round(s.x/s.w*s.pw)),iy:Math.max(0,Math.round(s.y/s.h*s.ph)),ox:0,oy:i*100,axis:s.axis||'vertical',output:Math.max(1,old.findIndex(o=>o.id===s.processor)+1)}));if(!valid(n))throw Error('Proyek lama tidak valid');return n}
try{let raw=localStorage.getItem('ledplanner-v3');if(raw)state=migrate(JSON.parse(raw));else{let old=localStorage.getItem('ledplanner-v1');if(old)state=migrate(JSON.parse(old))}selected=state.screens[0]?.id;activeOutput=state.outputs[0].id}catch{setTimeout(()=>notify('Data tersimpan tidak dapat dibaca. File lama tetap dipertahankan.'),300)}
function persist(){try{localStorage.setItem('ledplanner-v3',JSON.stringify(state));$('saveStatus').textContent='Lokal · tersimpan'}catch{$('saveStatus').textContent='Gagal simpan · unduh file';notify('Penyimpanan lokal penuh/tidak tersedia. Pilih Simpan file.')}}
function notify(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4000)}
const current=()=>state.screens.find(s=>s.id===selected),area=s=>s.w*s.h/1e6,sw=s=>s.cols*s.pw,sh=s=>s.rows*s.ph;
function order(s){let a=[];if(s.axis==='vertical'){for(let x=0;x<s.cols;x++)for(let j=0;j<s.rows;j++)a.push([x,x%2?s.rows-1-j:j])}else for(let y=0;y<s.rows;y++)for(let j=0;j<s.cols;j++)a.push([y%2?s.cols-1-j:j,y]);return a.map(([x,y])=>[s.corner.includes('r')?s.cols-1-x:x,s.corner.includes('b')?s.rows-1-y:y])}
function paths(s,type){let max=Math.floor((type==='data'?state.dataArea:state.powerArea)/area(s)+1e-9);if(type==='data'){let o=state.outputs.find(o=>o.id===s.output);if(o.pixelLimit)max=Math.min(max,Math.floor(o.pixelLimit/(s.pw*s.ph)))}if(max<1)return [];let a=order(s),n=Math.ceil(a.length/max),base=Math.floor(a.length/n),extra=a.length%n,start=0;return Array.from({length:n},(_,i)=>{let len=base+(i<extra?1:0),r=a.slice(start,start+len);start+=len;return r})}

function problems(){let a=[];for(let s of state.screens){if(!paths(s,'data').length)a.push(`${s.name}: satu kabinet melebihi batas data.`);if(!paths(s,'power').length)a.push(`${s.name}: satu kabinet melebihi batas power.`);let o=state.outputs.find(o=>o.id===s.output);if(inputBounds(s).x < -1e-6 || inputBounds(s).y < -1e-6 || inputBounds(s).right>state.inputW+1e-6||inputBounds(s).bottom>state.inputH+1e-6)a.push(`${s.name}: keluar dari input canvas.`);if(s.ox+sw(s)>o.width||s.oy+sh(s)>o.height)a.push(`${s.name}: keluar dari ${o.name}.`)}for(let o of state.outputs){let n=allPaths('data').filter(r=>r.output===o.id).length;if(n>o.ports)a.push(`${o.name}: membutuhkan ${n} port; tersedia ${o.ports}.`)}for(let i=0;i<state.screens.length;i++)for(let j=i+1;j<state.screens.length;j++){let s=state.screens[i],t=state.screens[j];if(s.output===t.output&&s.ox<t.ox+sw(t)&&s.ox+sw(s)>t.ox&&s.oy<t.oy+sh(t)&&s.oy+sh(s)>t.oy)a.push(`${s.name} dan ${t.name}: output bertumpuk.`)}return a}

renderEditor=function(){previousEditor();let editor=document.querySelector('.editor'),bar=document.querySelector('.canvas-bar'),s=current(),o=state.outputs.find(o=>o.id===activeOutput);if(!editor||!bar)return;
let controls=document.createElement('section');controls.className='transform-controls';controls.innerHTML=`<h2>Transform & warna</h2>${s?`<div class="pair">${input('Rotasi input °','angle',s.angle)}<label>Warna layar<input type="color" value="${s.color}" onchange="edit('screen','color',this.value)"></label></div><div class="mini-actions"><button onclick="edit('screen','angle',${s.angle-90})">↶ 90°</button><button onclick="edit('screen','angle',0)">Reset</button><button onclick="edit('screen','angle',${s.angle+90})">↷ 90°</button></div>`:'<p class="helper">Pilih layar untuk mengubah properti.</p>'}<hr><h2>Ukuran canvas</h2>${sizeCard('input')}${sizeCard('output')}<p class="helper">Unlock: ukuran mengikuti batas LED dan posisinya. Lock: ukuran tetap, dapat diisi manual. Lock hanya mengunci ukuran canvas; LED tetap bisa digeser.</p>`;editor.append(controls);
let toolbar=document.createElement('div');toolbar.className='tools';toolbar.innerHTML=`<button title="Move (V)" aria-label="Move tool" class="${tool==='move'?'active':''}" onclick="setTool('move')">↖ <span>Move</span></button><button title="Hand (H), Space sementara" aria-label="Hand tool" class="${tool==='hand'?'active':''}" onclick="setTool('hand')">✋ <span>Hand</span></button><button title="Snap ke tepi panel" class="${snap?'active':''}" onclick="snap=!snap;render()">Snap</button><button title="Undo Ctrl+Z" onclick="undo()" ${history.length?'':'disabled'}>↶</button><button title="Redo Ctrl+Shift+Z" onclick="redo()" ${future.length?'':'disabled'}>↷</button><span class="spacer"></span><button onclick="zoomView(1.25)">−</button><button onclick="fitView()">Fit</button><button onclick="actualView()">100%</button><button onclick="zoomView(.8)">+</button><button onclick="fullscreen()" title="Fullscreen">⛶</button>`;
// Replace the old percentage zoom buttons; keep mode and output selectors.
[...bar.querySelectorAll('button')].filter(b=>['−','Fit','+'].includes(b.textContent.trim())).forEach(b=>b.remove());bar.after(toolbar);let lockbar=document.createElement('div');lockbar.className='canvas-lockbar';lockbar.innerHTML=activeLockControl();toolbar.after(lockbar);editor.querySelectorAll('input').forEach(el=>{let change=el.getAttribute('onchange')||'';if(['inputW','inputH','width','height'].some(k=>change.includes("'"+k+"'"))&&!el.closest('.size-card'))el.closest('label')?.remove()});
let status=document.querySelector('.bottom');status.innerHTML=`<span id="viewScale"></span> · ${tab==='Kabel'?'Tampak depan':'Input '+state.inputW+' × '+state.inputH+' px'} · <span>${tab==='Kabel'?'Titik = awal kabel':'V Move · H Hand · Space pan · scroll zoom'}</span>`;applyView();};
canvasSVG=function(v=tab==='Kabel'?'cable':mode,interactive=false){hydrate();let xml=previousSVG(v);state.screens.forEach((s,i)=>{let from=`<g data-screen="${s.id}" transform="translate(${v==='input'?s.ix:s.ox} ${v==='input'?s.iy:s.oy})"`;let to=from.slice(0,-1)+(v==='input'?` rotate(${s.angle} ${sw(s)/2} ${sh(s)/2})`: '')+'"';xml=xml.replace(from,to);let start=xml.indexOf(`<g data-screen="${s.id}"`);if(start<0)return;let end=xml.indexOf('</g>',start),chunk=xml.slice(start,end);if(v!=='cable')chunk=chunk.split(colors[i%6]).join(s.color);if(interactive&&v==='input'&&s.id===selected)chunk+=`<line x1="${sw(s)/2}" y1="0" x2="${sw(s)/2}" y2="-24" stroke="#dcfbbd"/><circle data-rotate="${s.id}" cx="${sw(s)/2}" cy="-24" r="9" fill="#b6f376" stroke="#16230e" stroke-width="2" style="cursor:crosshair"/>`;xml=xml.slice(0,start)+chunk+xml.slice(end)});return xml};
function dimensions(){let o=state.outputs.find(o=>o.id===activeOutput);return tab!=='Kabel'&&mode==='input'?{w:state.inputW,h:state.inputH}:{w:o.width,h:o.height}}
function setTool(t){tool=t;render()}
function fitView(){let svg=$('canvas');if(!svg)return;let d=dimensions(),r=svg.getBoundingClientRect(),ratio=(r.width||800)/(r.height||470),w=d.w+80,h=d.h+80;if(w/h<ratio)w=h*ratio;else h=w/ratio;view={x:(d.w-w)/2,y:(d.h-h)/2,w,h};applyView()}
function applyView(){let svg=$('canvas');if(!svg)return;svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);svg.style.width='100%';svg.style.height='100%';svg.style.cursor=spaceHeld||tool==='hand'?'grab':'default';svg.querySelectorAll('[data-screen]').forEach(g=>g.style.cursor=spaceHeld||tool==='hand'?'grab':tab==='Kabel'?'pointer':'move');let r=svg.getBoundingClientRect();if($('viewScale'))$('viewScale').textContent=Math.round(r.width/view.w*100)+'%';}
function actualView(){let r=$('canvas').getBoundingClientRect(),cx=view.x+view.w/2,cy=view.y+view.h/2;view={x:cx-r.width/2,y:cy-r.height/2,w:r.width,h:r.height};applyView()}
function zoomView(f,px=.5,py=.5){let nw=Math.max(20,Math.min(150000,view.w*f)),ratio=nw/view.w;view={x:view.x+view.w*px*(1-ratio),y:view.y+view.h*py*(1-ratio),w:nw,h:view.h*ratio};applyView()}
function mousePoint(e,svg){return new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse())}
function snapped(n,s,axis){if(!snap||tab==='Kabel'||(mode==='input'&&s.angle))return Math.round(n);let key=mode==='input'?(axis==='x'?'ix':'iy'):(axis==='x'?'ox':'oy'),size=axis==='x'?sw(s):sh(s),targets=[0],tol=view.w/Math.max(1,$('canvas').clientWidth)*7;for(let o of state.screens){if(o.id===s.id||(mode==='output'&&o.output!==s.output)||(mode==='input'&&o.angle))continue;let v=o[key],d=axis==='x'?sw(o):sh(o);targets.push(v,v+d,v-size,v+d-size)}let best=n,diff=tol;for(let t of targets)if(Math.abs(t-n)<diff){best=t;diff=Math.abs(t-n)}return Math.round(best)}
const touches=new Map();let pinch=null;
drawCanvas=function(){$('stage').innerHTML=canvasSVG(undefined,true);let svg=$('canvas'),key=tab+':'+mode+':'+activeOutput+':'+dimensions().w+':'+dimensions().h;svg.style.width='100%';svg.style.height='100%';if(key!==viewKey){viewKey=key;fitView()}else applyView();svg.onwheel=e=>{e.preventDefault();let r=svg.getBoundingClientRect();zoomView(Math.exp(Math.max(-100,Math.min(100,e.deltaY))*.002),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)};
svg.onpointerdown=e=>{if(e.button!==0&&e.button!==1)return;e.preventDefault();svg.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){let [a,b]=[...touches.values()];pinch={distance:Math.hypot(a.x-b.x,a.y-b.y)};drag=null;return}let p=mousePoint(e,svg),g=e.target.closest('[data-screen]');if(tool==='hand'||spaceHeld||e.button===1||!g){drag={kind:'pan',clientX:e.clientX,clientY:e.clientY,view:{...view}};svg.style.cursor='grabbing';return}selected=g.dataset.screen;let s=current();if(e.target.hasAttribute('data-rotate')){let cx=s.ix+sw(s)/2,cy=s.iy+sh(s)/2;drag={kind:'rotate',cx,cy,start:Math.atan2(p.y-cy,p.x-cx),angle:s.angle};return}if(tab==='Kabel'){touches.clear();render();return}drag={kind:'move',x:p.x-(mode==='input'?s.ix:s.ox),y:p.y-(mode==='input'?s.iy:s.oy)};};
svg.onpointermove=e=>{if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2&&pinch){let [a,b]=[...touches.values()],dist=Math.hypot(a.x-b.x,a.y-b.y),r=svg.getBoundingClientRect();if(dist>2){zoomView(pinch.distance/dist,((a.x+b.x)/2-r.left)/r.width,((a.y+b.y)/2-r.top)/r.height);pinch.distance=dist}return}if(!drag)return;if(drag.kind==='pan'){let r=svg.getBoundingClientRect();view={...drag.view,x:drag.view.x-(e.clientX-drag.clientX)*drag.view.w/r.width,y:drag.view.y-(e.clientY-drag.clientY)*drag.view.h/r.height};applyView();svg.style.cursor='grabbing';return}let p=mousePoint(e,svg),s=current();if(drag.kind==='rotate'){let a=drag.angle+(Math.atan2(p.y-drag.cy,p.x-drag.cx)-drag.start)*180/Math.PI;if(e.shiftKey)a=Math.round(a/15)*15;s.angle=((Math.round(a)%360)+360)%360}else{let x=Math.max(0,Math.min(65000,snapped(p.x-drag.x,s,'x'))),y=Math.max(0,Math.min(65000,snapped(p.y-drag.y,s,'y')));if(mode==='input'){s.ix=x;s.iy=y}else{s.ox=x;s.oy=y}}svg.querySelector(`[data-screen="${s.id}"]`).setAttribute('transform',`translate(${mode==='input'?s.ix:s.ox} ${mode==='input'?s.iy:s.oy}) ${mode==='input'?`rotate(${s.angle} ${sw(s)/2} ${sh(s)/2})`:''}`);liveCanvasSize()};
svg.onpointerup=svg.onpointercancel=e=>{touches.delete(e.pointerId);if(pinch){if(touches.size===0){pinch=null;render()}return}if(drag){let changed=drag.kind!=='pan';drag=null;if(changed)render();else applyView()}};
};
resizeCanvas=()=>applyView();
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else{document.body.classList.toggle('canvas-full');fitView()}}catch{document.body.classList.toggle('canvas-full');fitView()}}
document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('canvas-full',!!document.fullscreenElement);requestAnimationFrame(fitView)});
window.addEventListener('resize',()=>{let svg=$('canvas');if(!svg)return;let r=svg.getBoundingClientRect();if(r.width&&r.height){view.h=view.w*r.height/r.width;applyView()}});
window.addEventListener('blur',()=>{spaceHeld=false;drag=null;touches.clear();pinch=null;applyView()});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable="true"]'))return;let k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo();return}if(k==='v'){setTool('move')}if(k==='h'){setTool('hand')}if(e.code==='Space'){e.preventDefault();spaceHeld=true;applyView()}if(k==='escape'){document.body.classList.remove('canvas-full');drag=null;applyView()}if(tab==='Mapping'&&current()&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let s=current(),key=(mode==='input'?'i':'o')+(['ArrowLeft','ArrowRight'].includes(e.key)?'x':'y'),d=(e.shiftKey?10:1)*(['ArrowLeft','ArrowUp'].includes(e.key)?-1:1);edit('screen',key,Math.max(0,Math.min(100000,s[key]+d)))}});
document.addEventListener('keyup',e=>{if(e.code==='Space'){spaceHeld=false;applyView()}});
hydrate();autoSize();

function sizeCard(which){let isInput=which==='input',o=state.outputs.find(o=>o.id===activeOutput),locked=(isInput?state.inputMode:o.sizeMode)==='custom',scope=isInput?'project':'output',w=isInput?state.inputW:o.width,h=isInput?state.inputH:o.height;return `<section class="size-card"><div><b>${isInput?'Input':escapeHTML(o.name)}</b><button aria-pressed="${locked}" aria-label="${isInput?'Input':'Output'} canvas lock" onclick="toggleCanvasLock('${which}')">${locked?'🔒 Lock':'🔓 Unlock'}</button></div><div class="pair"><label>Lebar px<input data-size="${which}-w" type="number" min="1" max="32768" value="${w}" ${locked?'':'readonly'} onchange="edit('${scope}','${isInput?'inputW':'width'}',Number(this.value))"></label><label>Tinggi px<input data-size="${which}-h" type="number" min="1" max="32768" value="${h}" ${locked?'':'readonly'} onchange="edit('${scope}','${isInput?'inputH':'height'}',Number(this.value))"></label></div><small>${locked?'Manual · ukuran tetap':'Auto · mengikuti LED'}</small></section>`}
function activeLockControl(){let which=tab==='Mapping'&&mode==='input'?'input':'output',o=state.outputs.find(o=>o.id===activeOutput),locked=(which==='input'?state.inputMode:o.sizeMode)==='custom',d=dimensions();return `<span>${which==='input'?'INPUT':escapeHTML(o.name)} <b id="liveDimensions">${d.w} × ${d.h} px</b></span><button aria-pressed="${locked}" onclick="toggleCanvasLock('${which}')">${locked?'🔒 Locked · Manual':'🔓 Unlocked · Auto'}</button>`}
function toggleCanvasLock(which){let o=state.outputs.find(o=>o.id===activeOutput);if(which==='input')state.inputMode=state.inputMode==='auto'?'custom':'auto';else o.sizeMode=o.sizeMode==='auto'?'custom':'auto';render()}
function liveCanvasSize(){autoSize(false);let d=dimensions(),svg=$('canvas');if(!svg)return;let rect=svg.querySelector('#canvasExtent'),bg=svg.querySelector('#canvasBackground'),caption=svg.querySelector('#canvasCaption');if(rect){rect.setAttribute('width',d.w);rect.setAttribute('height',d.h)}if(bg){bg.setAttribute('width',d.w+80);bg.setAttribute('height',d.h+80)}if(caption)caption.textContent=(tab==='Mapping'&&mode==='input'?'INPUT':state.outputs.find(o=>o.id===activeOutput).name)+' · '+d.w+' × '+d.h+' px';if($('liveDimensions'))$('liveDimensions').textContent=d.w+' × '+d.h+' px';let o=state.outputs.find(o=>o.id===activeOutput);for(let [key,value] of Object.entries({'input-w':state.inputW,'input-h':state.inputH,'output-w':o.width,'output-h':o.height})){let el=document.querySelector('[data-size="'+key+'"]');if(el)el.value=value}}

render();
</script></body></html>
