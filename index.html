</style><header><b>▦ LED<span style="color:#b6f36b">PLANNER</span></b><small>by HDRG Creative Partner · Trial 0.2</small><div class="actions"><button onclick="backup()">↓ Backup JSON</button><button onclick="document.getElementById('file').click()">Import</button><button class="primary" onclick="save(true)">Simpan proyek</button></div></header><input type="file" id="file" accept=".json" hidden><nav id="nav"></nav><main><div class="stats" id="stats"></div><div id="view"></div></main><div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({version:1,processors:[],name:'Proyek event baru',venue:'',date:'',crew:'',equipment:'',screens:[{id:1,name:'Main LED',cols:6,rows:4,w:500,h:500,pw:128,ph:128,watts:150,x:600,y:500,perPort:8,axis:'vertical'}]});let p=fresh(),tab='Layout',selected=1,drag=null;try{let v=JSON.parse(localStorage.getItem('ledplanner-v1'));if(v&&valid(v)){p=v;selected=p.screens[0]?.id}}catch{};
const tabs=['Overview','Layout','Data Cable','Processors','Equipment','Crew','Export'];const screen=()=>p.screens.find(s=>s.id===selected);const count=()=>p.screens.reduce((a,s)=>a+s.cols*s.rows,0);const power=()=>p.screens.reduce((a,s)=>a+s.cols*s.rows*s.watts,0);
function valid(v){return v&&v.version===1&&typeof v.name==='string'&&['venue','date','crew','equipment'].every(k=>typeof v[k]==='string')&&Array.isArray(v.screens)&&v.screens.length<=50&&new Set(v.screens.map(s=>s.id)).size===v.screens.length&&processorsValid(v)&&v.screens.every(s=>Number.isFinite(s.id)&&typeof s.name==='string'&&['x','y'].every(k=>Number.isFinite(s[k])&&s[k]>=0&&s[k]<=100000)&&['cols','rows','w','h','pw','ph','watts','perPort'].every(k=>Number.isFinite(s[k])&&s[k]>0&&s[k]<=10000)&&s.cols<=50&&s.rows<=50&&['cols','rows','pw','ph','perPort'].every(k=>Number.isInteger(s[k]))&&['vertical','horizontal'].includes(s.axis))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)}function save(show=false){try{localStorage.setItem('ledplanner-v1',JSON.stringify(p));if(show)toast('Proyek disimpan di browser ini')}catch{toast('Penyimpanan gagal. Unduh backup JSON.')}}
function field(title,key,value,type='text'){return `<label>${title}<input type="${type}" value="${esc(value)}" onchange="project('${key}',this.value)"></label>`}function project(k,v){p[k]=v;save()}
function draw(){ $('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';draw()">${t}</button>`).join('');$('stats').innerHTML=[['Layar',p.screens.length],['Kabinet',count()],['Total piksel',p.screens.reduce((a,s)=>a+s.cols*s.rows*s.pw*s.ph,0).toLocaleString('id-ID')],['Daya maksimum',(power()/1000).toFixed(2)+' kW']].map(([a,b])=>`<div class="stat"><small>${a}</small><strong>${b}</strong></div>`).join('');
if(tab==='Overview')$('view').innerHTML=`<div class="panel wide"><h2>Informasi proyek</h2>${field('Nama event','name',p.name)}${field('Venue','venue',p.venue)}${field('Tanggal acara','date',p.date,'date')}<div class="notice">Mulai dari Layout, susun kabinet, lalu gambar jalur data. Semua data tersimpan pada browser ini. Gunakan backup JSON untuk berpindah perangkat.</div><button onclick="if(confirm('Buat proyek baru? Unduh backup jika proyek ini masih diperlukan.')){p=fresh();selected=1;save();draw()}">Proyek baru</button></div>`;
else if(tab==='Layout'||tab==='Data Cable') editor();
else if(tab==='Equipment')$('view').innerHTML=`<div class="panel wide"><h2>Kebutuhan perangkat</h2><table><thead><tr><th>Layar</th><th>Kabinet</th><th>Resolusi</th><th>Jalur data*</th></tr></thead><tbody>${p.screens.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.cols*s.rows}</td><td>${s.cols*s.pw} × ${s.rows*s.ph}</td><td>${Math.ceil(s.cols*s.rows/s.perPort)}</td></tr>`).join('')}</tbody></table><p class="muted">*Pembagian berdasarkan jumlah kabinet per jalur yang Anda tentukan. Kapasitas prosesor belum diverifikasi.</p><label>Perangkat tambahan, stok, dan kekurangan<textarea onchange="project('equipment',this.value)" placeholder="Prosesor, laptop, kabel utama, converter, spare…">${esc(p.equipment)}</textarea></label><button onclick="csv()">Unduh daftar kabinet CSV</button></div>`;
else if(tab==='Crew')$('view').innerHTML=`<div class="panel wide"><h2>Penugasan crew</h2><p class="muted">Catat nama, peran, kontak kerja, call time, serta area pemasangan.</p><label>Catatan crew<textarea onchange="project('crew',this.value)" placeholder="PIC: …&#10;Teknisi LED: …&#10;Operator: …&#10;Call time: …">${esc(p.crew)}</textarea></label></div>`;
else $('view').innerHTML=`<div class="panel wide"><h2>Export proyek</h2><p>Dokumen untuk ${esc(p.name)}</p><p><button onclick="backup()">Backup JSON</button> <button onclick="png()">Layout PNG</button> <button onclick="csv()">Kabinet CSV</button> <button onclick="tab='Layout';draw();window.print()">Cetak layout / PDF</button></p><div class="notice"><b>XML Resolume — tahap berikutnya</b><br>Versi ini belum mengekspor XML Resolume. Input/output mapping dan kompatibilitas preset perlu diimplementasikan serta diuji dengan contoh XML dari versi Arena yang digunakan.</div><p class="muted">Routing power, stok bersama, dan pembagian prosesor juga belum tersedia. Daya di atas adalah penjumlahan spesifikasi kabinet, bukan validasi distribusi listrik.</p></div>`;
}
function editor(){let s=screen();$('view').innerHTML=`<div class="work"><aside class="panel editor"><h2>Layar proyek</h2><div class="list">${p.screens.map(s=>`<button class="${s.id===selected?'selected':''}" onclick="selected=${s.id};draw()">${esc(s.name)} · ${s.cols*s.rows} kabinet</button>`).join('')}</div><button class="primary" onclick="add()">+ Tambah layar</button>${s?`<hr><label>Nama layar<input value="${esc(s.name)}" onchange="change('name',this.value)"></label><div class="pair">${number('Kolom','cols',s.cols)}${number('Baris','rows',s.rows)}${number('Lebar kabinet mm','w',s.w)}${number('Tinggi kabinet mm','h',s.h)}${number('Piksel lebar','pw',s.pw)}${number('Piksel tinggi','ph',s.ph)}${number('Daya maks W','watts',s.watts)}${number('Kabinet / jalur','perPort',s.perPort)}${number('Posisi X mm','x',s.x)}${number('Posisi Y mm','y',s.y)}</div><label>Arah routing<select onchange="change('axis',this.value)"><option value="vertical" ${s.axis==='vertical'?'selected':''}>Zig-zag vertikal</option><option value="horizontal" ${s.axis==='horizontal'?'selected':''}>Zig-zag horizontal</option></select></label><button onclick="removeScreen()">Hapus layar</button>`:''}</aside><section class="panel canvas"><div class="bar"><b>${tab==='Layout'?'Stage layout':'Jalur kabel data'}</b><small>Tampak depan · geser layar untuk memindahkan</small></div><div id="stage"></div><div class="bar muted">${s?`${esc(s.name)}: ${s.cols*s.w/1000} × ${s.rows*s.h/1000} m · ${s.cols*s.pw} × ${s.rows*s.ph} px`: 'Tambahkan layar'} · posisi dalam mm</div></section></div>`;renderSVG()}
function number(label,k,v){return `<label>${label}<input type="number" min="${['x','y'].includes(k)?0:1}" value="${v}" onchange="change('${k}',Number(this.value))"></label>`}function change(k,v){let s=screen(),old=s[k];s[k]=v;if(!valid(p)){s[k]=old;toast('Nilai tidak valid. Kolom/baris maksimal 50.')}save();draw()}function add(){if(p.screens.length>=50)return toast('Maksimal 50 layar');let s={...fresh().screens[0],id:Date.now(),name:'Layar '+(p.screens.length+1),cols:2,rows:4,x:1000+p.screens.length*800,y:500};p.screens.push(s);selected=s.id;save();draw()}function removeScreen(){if(!confirm('Hapus layar terpilih?'))return;p.screens=p.screens.filter(s=>s.id!==selected);selected=p.screens[0]?.id;save();draw()}
const colors=['#b6f36b','#67d8ff','#ffae72','#c99bff','#ff82b6','#f5dc6d'];function route(s){let a=[];if(s.axis==='vertical'){for(let x=0;x<s.cols;x++)for(let j=0;j<s.rows;j++)a.push([x,x%2?s.rows-1-j:j])}else for(let y=0;y<s.rows;y++)for(let j=0;j<s.cols;j++)a.push([y%2?s.cols-1-j:j,y]);return a}
function svgMarkup(){let width=Math.max(7000,...p.screens.map(s=>s.x+s.cols*s.w+600)),height=Math.max(4000,...p.screens.map(s=>s.y+s.rows*s.h+600));return `<svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}"><defs><pattern id="grid" width="250" height="250" patternUnits="userSpaceOnUse"><path d="M250 0H0V250" fill="none" stroke="#243041" stroke-width="8"/></pattern></defs><rect width="100%" height="100%" fill="#101720"/><rect width="100%" height="100%" fill="url(#grid)"/>${p.screens.map((s,index)=>{let coords=route(s),n=s.cols*s.rows;return `<g data-id="${s.id}" transform="translate(${s.x},${s.y})" style="cursor:move"><text x="0" y="-75" font-size="95" fill="#eef5ff">${esc(s.name)} · ${s.cols*s.pw} × ${s.rows*s.ph}</text>${coords.map(([x,y],i)=>`<rect x="${x*s.w+7}" y="${y*s.h+7}" width="${s.w-14}" height="${s.h-14}" fill="${colors[index%6]}" fill-opacity=".13" stroke="${s.id===selected?'#b6f36b':'#64748b'}" stroke-width="10"/><text x="${(x+.5)*s.w}" y="${(y+.5)*s.h}" text-anchor="middle" dominant-baseline="middle" fill="#dee8f6" font-size="${Math.min(s.w,s.h)*.2}">${tab==='Data Cable'?`P${Math.floor(i/s.perPort)+(s.startPort||1)} · ${i%s.perPort+1}`:i+1}</text>`).join('')}${tab==='Data Cable'?Array.from({length:Math.ceil(n/s.perPort)},(_,j)=>{let a=coords.slice(j*s.perPort,(j+1)*s.perPort);return `<polyline points="${a.map(([x,y])=>`${(x+.5)*s.w},${(y+.72)*s.h}`).join(' ')}" fill="none" stroke="${colors[j%6]}" stroke-width="22"/><circle cx="${(a[0][0]+.5)*s.w}" cy="${(a[0][1]+.72)*s.h}" r="35" fill="${colors[j%6]}"/>`}).join(''):''}</g>`}).join('')}</svg>`}
function renderSVG(){$('stage').innerHTML=svgMarkup();let svg=$('svg');svg.onpointerdown=e=>{let g=e.target.closest('[data-id]');if(!g)return;selected=Number(g.dataset.id);let pt=point(e,svg),s=screen();drag={dx:pt.x-s.x,dy:pt.y-s.y};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;let pt=point(e,svg),s=screen();s.x=Math.max(0,Math.min(100000,Math.round((pt.x-drag.dx)/50)*50));s.y=Math.max(0,Math.min(100000,Math.round((pt.y-drag.dy)/50)*50));svg.querySelector(`[data-id="${s.id}"]`).setAttribute('transform',`translate(${s.x},${s.y})`)};svg.onpointerup=svg.onpointercancel=()=>{if(drag){drag=null;save();draw()}}}function point(e,svg){return new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse())}
function download(data,name,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download(JSON.stringify(p,null,2),'ledplanner-project.json','application/json')}function csv(){let q=v=>'"'+String(v).replace(/"/g,'""')+'"';download('\ufeff'+[['Layar','Kabinet','Lebar mm','Tinggi mm','Lebar px','Tinggi px','Daya maks W'],...p.screens.map(s=>[ /^[=+@-]/.test(s.name)?"'"+s.name:s.name,s.cols*s.rows,s.cols*s.w,s.rows*s.h,s.cols*s.pw,s.rows*s.ph,s.cols*s.rows*s.watts])].map(r=>r.map(q).join(',')).join('\r\n'),'ledplanner-equipment.csv','text/csv;charset=utf-8')}
function png(){let img=new Image(),u=URL.createObjectURL(new Blob([svgMarkup().replace('<svg id=', '<svg width="2400" height="1500" id=')],{type:'image/svg+xml'}));img.onload=()=>{let c=document.createElement('canvas');c.width=2400;c.height=Math.round(2400*img.height/img.width)||1400;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(b)download(b,'ledplanner-layout.png','image/png')});URL.revokeObjectURL(u)};img.onerror=()=>{URL.revokeObjectURL(u);toast('Gagal membuat PNG')};img.src=u}
$('file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>2e6)throw Error();let v=JSON.parse(await f.text());if(!valid(v))throw Error();if(!confirm('Ganti proyek aktif dengan file ini?'))return;p=v;selected=p.screens[0]?.id;save();draw();toast('Proyek berhasil diimpor')}catch{toast('File proyek tidak valid atau terlalu besar')}e.target.value=''};function processorsValid(v){if(v.processors!==undefined&&(!Array.isArray(v.processors)||v.processors.length>32||new Set(v.processors.map(a=>a.id)).size!==v.processors.length||!v.processors.every(a=>typeof a.id==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(a.id)&&typeof a.name==='string'&&typeof a.brand==='string'&&typeof a.model==='string'&&Number.isInteger(a.ports)&&a.ports>0&&a.ports<=128&&Number.isFinite(a.limit)&&a.limit>=0&&a.limit<=100000000)))return false;return v.screens.every(s=>(s.processor===undefined||typeof s.processor==='string')&&(s.startPort===undefined||(Number.isInteger(s.startPort)&&s.startPort>0&&s.startPort<=128)))}
const oldDraw=draw,oldEditor=editor;let zoom=1;
draw=function(){p.processors??=[];oldDraw();let intro=document.createElement('div');intro.className='intro';intro.innerHTML=`<div><h1>${esc(p.name||'Proyek tanpa nama')}</h1><p>${esc(p.venue||'Venue belum diisi')} · ${esc(p.date||'Tanggal belum ditentukan')}</p></div><span class="pill">● Tersimpan di perangkat ini</span>`;$('stats').before(intro);document.querySelectorAll('.intro').forEach((x,i,a)=>{if(i<a.length-1)x.remove()});if(tab==='Processors')processorsView();if(tab==='Export')exportsView();if(tab==='Equipment'){let table=$('view').querySelector('table');if(table){let wrap=document.createElement('div');wrap.className='table-wrap';table.before(wrap);wrap.append(table)}}};
editor=function(){oldEditor();let s=screen();if(!s)return;let box=document.createElement('div');box.innerHTML=`<hr><h2>Alokasi prosesor</h2><label>Unit prosesor<select onchange="change('processor',this.value)"><option value="">Belum dialokasikan</option>${p.processors.map(a=>`<option value="${esc(a.id)}" ${a.id===s.processor?'selected':''}>${esc(a.name)} · ${esc(a.brand)}</option>`).join('')}</select></label><label>Port awal<input type="number" min="1" max="128" value="${s.startPort||1}" onchange="change('startPort',Number(this.value))"></label><p class="helper">Setiap jalur memakai port berikutnya. Port antar layar harus berbeda. Urutan 1 adalah awal kabel; nomor bertambah mengikuti jalur.</p>`;document.querySelector('.editor').append(box);let t=document.createElement('div');t.className='toolbar';t.innerHTML='<button onclick="setZoom(-.25)" aria-label="Perkecil">−</button><button onclick="setZoom(0)">Fit</button><button onclick="setZoom(.25)" aria-label="Perbesar">+</button>';document.querySelector('.canvas .bar').append(t);applyZoom();};
function setZoom(d){zoom=d?Math.min(3,Math.max(1,zoom+d)):1;applyZoom()}function applyZoom(){if($('svg')){$('svg').style.width=zoom*100+'%';$('svg').style.height=(innerWidth<760?340:530)*zoom+'px'}}
function processorAdd(){if(p.processors.length>=32)return toast('Maksimal 32 prosesor');p.processors.push({id:'proc-'+Date.now(),name:'Prosesor '+(p.processors.length+1),brand:'NovaStar',model:'',ports:4,limit:0});save();draw()}
function procChange(id,k,v){let a=p.processors.find(x=>x.id===id),old=a[k];a[k]=v;if(!valid(p)){a[k]=old;toast('Nilai prosesor tidak valid')}save();draw()}
function procRemove(id){if(!confirm('Hapus unit ini dan lepas alokasi layarnya?'))return;p.processors=p.processors.filter(a=>a.id!==id);p.screens.filter(s=>s.processor===id).forEach(s=>s.processor='');save();draw()}
function processorsView(){$('view').innerHTML=`<div class="intro"><div><h1>Processor workspace</h1><p>Alokasikan layar ke beberapa unit, lalu periksa pembagian port.</p></div><button class="primary" onclick="processorAdd()">+ Tambah prosesor</button></div><div class="notice">Profil diisi manual sesuai model dan mode kerja. Nilai port awal adalah contoh. Batas piksel 0 berarti belum diketahui; kapasitas belum dapat divalidasi.</div><div class="cards">${p.processors.map(a=>`<section class="panel"><div class="processor-title"><h3>${esc(a.name)}</h3><button onclick="procRemove('${a.id}')">Hapus</button></div><label>Nama unit<input value="${esc(a.name)}" onchange="procChange('${a.id}','name',this.value)"></label><div class="pair"><label>Merek<select onchange="procChange('${a.id}','brand',this.value)">${['NovaStar','Colorlight','Linsn','Huidu','Brompton','Lainnya'].map(b=>`<option ${a.brand===b?'selected':''}>${b}</option>`).join('')}</select></label><label>Model<input placeholder="Isi model perangkat" value="${esc(a.model)}" onchange="procChange('${a.id}','model',this.value)"></label></div><div class="pair"><label>Jumlah port<input type="number" min="1" max="128" value="${a.ports}" onchange="procChange('${a.id}','ports',Number(this.value))"></label><label>Batas piksel / port<input type="number" min="0" value="${a.limit}" onchange="procChange('${a.id}','limit',Number(this.value))"></label></div><p class="helper">${p.screens.filter(s=>s.processor===a.id).length} layar dialokasikan · atur alokasi dari Layout atau Data Cable.</p><button onclick="exportPlan('csv','${a.id}')">↓ Port schedule CSV</button></section>`).join('')||'<div class="panel empty">Belum ada prosesor. Tambahkan unit, kemudian pilih unit tersebut pada layar.</div>'}</div>${validationHTML()}`}
function records(){let rows=[];for(let s of p.screens){let a=p.processors.find(a=>a.id===s.processor);route(s).forEach(([col,row],i)=>rows.push({processorId:a?.id||'',processor:a?.name||'Unassigned',brand:a?.brand||'',model:a?.model||'',screen:s.name,screenId:s.id,port:(s.startPort||1)+Math.floor(i/s.perPort),chainIndex:i%s.perPort+1,column:col+1,row:row+1,screenLocalX:col*s.pw,screenLocalY:row*s.ph,widthPx:s.pw,heightPx:s.ph,pixels:s.pw*s.ph}));}return rows}
function issues(){let out=[],groups=new Map();for(let s of p.screens){if(!p.processors.some(a=>a.id===s.processor))out.push(`${s.name}: belum dialokasikan ke prosesor.`)}for(let r of records()){if(!r.processorId)continue;let key=r.processorId+':'+r.port;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)}for(let rr of groups.values()){let r=rr[0],a=p.processors.find(a=>a.id===r.processorId),load=rr.reduce((n,r)=>n+r.pixels,0);if(r.port>a.ports)out.push(`${a.name}: port ${r.port} melampaui ${a.ports} port.`);if(new Set(rr.map(r=>r.screenId)).size>1)out.push(`${a.name} port ${r.port}: dipakai beberapa layar; ubah port awal.`);if(a.limit&&load>a.limit)out.push(`${a.name} port ${r.port}: ${load.toLocaleString('id-ID')} piksel melebihi batas ${a.limit.toLocaleString('id-ID')}.`)}for(let a of p.processors)if(!a.limit)out.push(`${a.name}: kapasitas piksel per port belum diisi.`);return out}
function validationHTML(){let a=issues();return `<section class="panel" style="margin-top:18px"><h2>Pemeriksaan rencana</h2>${a.length?'<ul class="helper">'+a.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p>Tidak ditemukan konflik pada alokasi dan batas piksel yang diisi.</p>'}<p class="helper">Pemeriksaan ini tidak mencakup bandwidth mode video, batas lebar/tinggi prosesor, redundansi, receiving card, atau listrik.</p></section>`}
function exportsView(){$('view').innerHTML=`<div class="cards"><section class="panel"><h2>Paket proyek</h2><p class="helper">Simpan proyek dan bagikan layout kepada tim.</p><div class="export-btns"><button onclick="backup()">JSON backup</button><button onclick="png()">Layout PNG</button><button onclick="csv()">Kabinet CSV</button><button onclick="tab='Layout';draw();window.print()">Cetak / PDF</button></div></section><section class="panel"><h2>Multi-processor planning</h2><p class="helper">Daftar kabinet per unit, port, urutan kabel, serta koordinat piksel lokal layar. Dapat dipakai sebagai panduan input manual pada software vendor.</p><div class="export-btns"><button class="primary" onclick="exportPlan('csv')">Port schedule CSV</button><button onclick="exportPlan('json')">Planning JSON</button></div><p class="helper">${p.processors.length} unit · ${records().length} kabinet · semua merek yang Anda tambahkan.</p></section></div><div class="notice"><b>Status kompatibilitas</b><br>CSV dan JSON ini adalah dokumen perencanaan LED Planner. File ini belum dapat langsung diimpor sebagai konfigurasi NovaLCT, LEDSetting, atau software prosesor lain. Koordinat bersifat lokal pada setiap layar, belum berupa mapping output prosesor.</div><div class="table-wrap"><table><thead><tr><th>Target</th><th>Tersedia</th><th>Konfigurasi native</th></tr></thead><tbody><tr><td>NovaStar</td><td>Port schedule CSV / JSON</td><td>SCR / RCFGX belum didukung</td></tr><tr><td>Colorlight</td><td>Port schedule CSV / JSON</td><td>Belum didukung; perlu contoh file dan versi software</td></tr><tr><td>Linsn / Huidu / Brompton / lainnya</td><td>Port schedule CSV / JSON</td><td>Belum didukung</td></tr><tr><td>Resolume Arena</td><td>Layout PNG</td><td>Advanced Output XML belum didukung</td></tr></tbody></table></div>${validationHTML()}`}
function exportPlan(format,id){let rows=records().filter(r=>!id||r.processorId===id);if(!rows.length)return toast('Belum ada kabinet pada pilihan ini');let data={format:'ledplanner-planning',version:1,nativeImportCompatible:false,coordinateSystem:'screen-local pixels; front view; zero-based origin; rows/columns one-based',project:p.name,exportedAt:new Date().toISOString(),processors:p.processors.filter(a=>!id||a.id===id),warnings:issues(),cabinets:rows};if(format==='json')download(JSON.stringify(data,null,2),'ledplanner-planning.json','application/json');else{let keys=Object.keys(rows[0]);let q=v=>'"'+String(/^[=+@-]/.test(String(v))?"'"+v:v).replace(/"/g,'""')+'"';download('\ufeff'+[keys,...rows.map(r=>keys.map(k=>r[k]))].map(a=>a.map(q).join(',')).join('\r\n'),'ledplanner-port-schedule.csv','text/csv;charset=utf-8')}toast('Export planning selesai — bukan file konfigurasi native')}
draw();
</script></html>
