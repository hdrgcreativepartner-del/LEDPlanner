<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LED Planner — HDRG</title><style>
:root{color-scheme:dark;font:14px system-ui;color:#e5edf6;background:#10141c}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;border:1px solid #354052;border-radius:7px;padding:10px;background:#1b2330;color:inherit}button{cursor:pointer}button:hover{border-color:#b6f36b}button.primary{background:#b6f36b;color:#14220a;border:0;font-weight:700}header{padding:20px 28px;border-bottom:1px solid #303744;display:flex;align-items:center;gap:16px}header b{font-size:23px}header small{color:#98a6bb}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}nav{display:flex;gap:8px;padding:16px 28px;overflow:auto}nav button.active{color:#b6f36b;border-color:#b6f36b}main{padding:0 28px 28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat,.panel{background:#181f2b;border:1px solid #303a49;border-radius:12px;padding:18px}.stat strong{display:block;font-size:27px;margin-top:8px}.muted,small{color:#a8b6c8}.work{display:grid;grid-template-columns:270px 1fr;gap:16px}.panel h2{font-size:16px;margin:0 0 18px}label{display:block;margin:10px 0;color:#a8b6c8}label input,label select,label textarea{display:block;width:100%;margin-top:6px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.canvas{padding:0;overflow:hidden;min-width:0}.bar{padding:15px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #303744}svg{width:100%;height:510px;display:block;touch-action:none;background:#101720}.list button{display:block;width:100%;text-align:left;margin-bottom:7px}.list .selected{border-color:#b6f36b}.notice{padding:12px;border-left:3px solid #b6f36b;background:#222d2c;line-height:1.6;margin:14px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #303744}textarea{min-height:130px}#toast{position:fixed;bottom:20px;right:20px;background:#b6f36b;color:#17250d;padding:12px;border-radius:8px;display:none}a{color:#b6f36b}.wide{max-width:1000px;margin:auto}@media(max-width:800px){header{flex-wrap:wrap;padding:16px}.actions{margin-left:0}.work{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}main{padding:0 14px 20px}svg{height:370px}nav{padding:14px}table{font-size:12px}}@media print{header .actions,nav,button,.editor{display:none!important}body{background:white;color:black}.panel,.stat{background:white;border-color:#999}svg{height:400px}.work{display:block}.muted,small{color:#555}}
</style><header><b>▦ LED<span style="color:#b6f36b">PLANNER</span></b><small>by HDRG Creative Partner · Trial 0.1</small><div class="actions"><button onclick="backup()">↓ Backup JSON</button><button onclick="document.getElementById('file').click()">Import</button><button class="primary" onclick="save(true)">Simpan proyek</button></div></header><input type="file" id="file" accept=".json" hidden><nav id="nav"></nav><main><div class="stats" id="stats"></div><div id="view"></div></main><div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({version:1,name:'Proyek event baru',venue:'',date:'',crew:'',equipment:'',screens:[{id:1,name:'Main LED',cols:6,rows:4,w:500,h:500,pw:128,ph:128,watts:150,x:600,y:500,perPort:8,axis:'vertical'}]});let p=fresh(),tab='Layout',selected=1,drag=null;try{let v=JSON.parse(localStorage.getItem('ledplanner-v1'));if(v&&valid(v)){p=v;selected=p.screens[0]?.id}}catch{};
const tabs=['Overview','Layout','Data Cable','Equipment','Crew','Export'];const screen=()=>p.screens.find(s=>s.id===selected);const count=()=>p.screens.reduce((a,s)=>a+s.cols*s.rows,0);const power=()=>p.screens.reduce((a,s)=>a+s.cols*s.rows*s.watts,0);
function valid(v){return v&&v.version===1&&typeof v.name==='string'&&['venue','date','crew','equipment'].every(k=>typeof v[k]==='string')&&Array.isArray(v.screens)&&v.screens.length<=50&&new Set(v.screens.map(s=>s.id)).size===v.screens.length&&v.screens.every(s=>Number.isFinite(s.id)&&typeof s.name==='string'&&['x','y'].every(k=>Number.isFinite(s[k])&&s[k]>=0&&s[k]<=100000)&&['cols','rows','w','h','pw','ph','watts','perPort'].every(k=>Number.isFinite(s[k])&&s[k]>0&&s[k]<=10000)&&s.cols<=50&&s.rows<=50&&['cols','rows','pw','ph','perPort'].every(k=>Number.isInteger(s[k]))&&['vertical','horizontal'].includes(s.axis))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)}function save(show=false){try{localStorage.setItem('ledplanner-v1',JSON.stringify(p));if(show)toast('Proyek disimpan di browser ini')}catch{toast('Penyimpanan gagal. Unduh backup JSON.')}}
function field(title,key,value,type='text'){return `<label>${title}<input type="${type}" value="${esc(value)}" onchange="project('${key}',this.value)"></label>`}function project(k,v){p[k]=v;save()}
function draw(){ $('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';draw()">${t}</button>`).join('');$('stats').innerHTML=[['Layar',p.screens.length],['Kabinet',count()],['Total piksel',p.screens.reduce((a,s)=>a+s.cols*s.rows*s.pw*s.ph,0).toLocaleString('id-ID')],['Daya maksimum',(power()/1000).toFixed(2)+' kW']].map(([a,b])=>`<div class="stat"><small>${a}</small><strong>${b}</strong></div>`).join('');
if(tab==='Overview')$('view').innerHTML=`<div class="panel wide"><h2>Informasi proyek</h2>${field('Nama event','name',p.name)}${field('Venue','venue',p.venue)}${field('Tanggal acara','date',p.date,'date')}<div class="notice">Mulai dari Layout, susun kabinet, lalu gambar jalur data. Semua data tersimpan pada browser ini. Gunakan backup JSON untuk berpindah perangkat.</div><button onclick="if(confirm('Buat proyek baru? Unduh backup jika proyek ini masih diperlukan.')){p=fresh();selected=1;save();draw()}">Proyek baru</button></div>`;
else if(tab==='Layout'||tab==='Data Cable') editor();
else if(tab==='Equipment')$('view').innerHTML=`<div class="panel wide"><h2>Kebutuhan perangkat</h2><table><thead><tr><th>Layar</th><th>Kabinet</th><th>Resolusi</th><th>Jalur data*</th></tr></thead><tbody>${p.screens.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.cols*s.rows}</td><td>${s.cols*s.pw} × ${s.rows*s.ph}</td><td>${Math.ceil(s.cols*s.rows/s.perPort)}</td></tr>`).join('')}</tbody></table><p class="muted">*Pembagian berdasarkan jumlah kabinet per jalur yang Anda tentukan. Kapasitas prosesor belum diverifikasi.</p><label>Perangkat tambahan, stok, dan kekurangan<textarea onchange="project('equipment',this.value)" placeholder="Prosesor, laptop, kabel utama, converter, spare…">${esc(p.equipment)}</textarea></label><button onclick="csv()">Unduh daftar kabinet CSV</button></div>`;
else if(tab==='Crew')$('view').innerHTML=`<div class="panel wide"><h2>Penugasan crew</h2><p class="muted">Catat nama, peran, kontak kerja, call time, serta area pemasangan.</p><label>Catatan crew<textarea onchange="project('crew',this.value)" placeholder="PIC: …&#10;Teknisi LED: …&#10;Operator: …&#10;Call time: …">${esc(p.crew)}</textarea></label></div>`;
else $('view').innerHTML=`<div class="panel wide"><h2>Export proyek</h2><p>Dokumen untuk ${esc(p.name)}</p><p><button onclick="backup()">Backup JSON</button> <button onclick="png()">Layout PNG</button> <button onclick="csv()">Kabinet CSV</button> <button onclick="tab='Layout';draw();window.print()">Cetak layout / PDF</button></p><div class="notice"><b>XML Resolume — tahap berikutnya</b><br>Versi ini belum mengekspor XML Resolume. Input/output mapping dan kompatibilitas preset perlu diimplementasikan serta diuji dengan contoh XML dari versi Arena yang digunakan.</div><p class="muted">Routing power, stok bersama, dan pembagian prosesor juga belum tersedia. Daya di atas adalah penjumlahan spesifikasi kabinet, bukan validasi distribusi listrik.</p></div>`;
}
function editor(){let s=screen();$('view').innerHTML=`<div class="work"><aside class="panel editor"><h2>Layar proyek</h2><div class="list">${p.screens.map(s=>`<button class="${s.id===selected?'selected':''}" onclick="selected=${s.id};draw()">${esc(s.name)} · ${s.cols*s.rows} kabinet</button>`).join('')}</div><button class="primary" onclick="add()">+ Tambah layar</button>${s?`<hr><label>Nama layar<input value="${esc(s.name)}" onchange="change('name',this.value)"></label><div class="pair">${number('Kolom','cols',s.cols)}${number('Baris','rows',s.rows)}${number('Lebar kabinet mm','w',s.w)}${number('Tinggi kabinet mm','h',s.h)}${number('Piksel lebar','pw',s.pw)}${number('Piksel tinggi','ph',s.ph)}${number('Daya maks W','watts',s.watts)}${number('Kabinet / jalur','perPort',s.perPort)}${number('Posisi X mm','x',s.x)}${number('Posisi Y mm','y',s.y)}</div><label>Arah routing<select onchange="change('axis',this.value)"><option value="vertical" ${s.axis==='vertical'?'selected':''}>Zig-zag vertikal</option><option value="horizontal" ${s.axis==='horizontal'?'selected':''}>Zig-zag horizontal</option></select></label><button onclick="removeScreen()">Hapus layar</button>`:''}</aside><section class="panel canvas"><div class="bar"><b>${tab==='Layout'?'Stage layout':'Jalur kabel data'}</b><small>Tampak depan · geser layar untuk memindahkan</small></div><div id="stage"></div><div class="bar muted">${s?`${esc(s.name)}: ${s.cols*s.w/1000} × ${s.rows*s.h/1000} m · ${s.cols*s.pw} × ${s.rows*s.ph} px`: 'Tambahkan layar'} · posisi dalam mm</div></section></div>`;renderSVG()}
function number(label,k,v){return `<label>${label}<input type="number" min="${['x','y'].includes(k)?0:1}" value="${v}" onchange="change('${k}',Number(this.value))"></label>`}function change(k,v){let s=screen(),old=s[k];s[k]=v;if(!valid(p)){s[k]=old;toast('Nilai tidak valid. Kolom/baris maksimal 50.')}save();draw()}function add(){if(p.screens.length>=50)return toast('Maksimal 50 layar');let s={...fresh().screens[0],id:Date.now(),name:'Layar '+(p.screens.length+1),cols:2,rows:4,x:1000+p.screens.length*800,y:500};p.screens.push(s);selected=s.id;save();draw()}function removeScreen(){if(!confirm('Hapus layar terpilih?'))return;p.screens=p.screens.filter(s=>s.id!==selected);selected=p.screens[0]?.id;save();draw()}
const colors=['#b6f36b','#67d8ff','#ffae72','#c99bff','#ff82b6','#f5dc6d'];function route(s){let a=[];if(s.axis==='vertical'){for(let x=0;x<s.cols;x++)for(let j=0;j<s.rows;j++)a.push([x,x%2?s.rows-1-j:j])}else for(let y=0;y<s.rows;y++)for(let j=0;j<s.cols;j++)a.push([y%2?s.cols-1-j:j,y]);return a}
function svgMarkup(){let width=Math.max(7000,...p.screens.map(s=>s.x+s.cols*s.w+600)),height=Math.max(4000,...p.screens.map(s=>s.y+s.rows*s.h+600));return `<svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}"><defs><pattern id="grid" width="250" height="250" patternUnits="userSpaceOnUse"><path d="M250 0H0V250" fill="none" stroke="#243041" stroke-width="8"/></pattern></defs><rect width="100%" height="100%" fill="#101720"/><rect width="100%" height="100%" fill="url(#grid)"/>${p.screens.map((s,index)=>{let coords=route(s),n=s.cols*s.rows;return `<g data-id="${s.id}" transform="translate(${s.x},${s.y})" style="cursor:move"><text x="0" y="-75" font-size="95" fill="#eef5ff">${esc(s.name)} · ${s.cols*s.pw} × ${s.rows*s.ph}</text>${coords.map(([x,y],i)=>`<rect x="${x*s.w+7}" y="${y*s.h+7}" width="${s.w-14}" height="${s.h-14}" fill="${colors[index%6]}" fill-opacity=".13" stroke="${s.id===selected?'#b6f36b':'#64748b'}" stroke-width="10"/><text x="${(x+.5)*s.w}" y="${(y+.5)*s.h}" text-anchor="middle" dominant-baseline="middle" fill="#dee8f6" font-size="${Math.min(s.w,s.h)*.2}">${tab==='Data Cable'?`P${Math.floor(i/s.perPort)+1} · ${i%s.perPort+1}`:i+1}</text>`).join('')}${tab==='Data Cable'?Array.from({length:Math.ceil(n/s.perPort)},(_,j)=>{let a=coords.slice(j*s.perPort,(j+1)*s.perPort);return `<polyline points="${a.map(([x,y])=>`${(x+.5)*s.w},${(y+.72)*s.h}`).join(' ')}" fill="none" stroke="${colors[j%6]}" stroke-width="22"/><circle cx="${(a[0][0]+.5)*s.w}" cy="${(a[0][1]+.72)*s.h}" r="35" fill="${colors[j%6]}"/>`}).join(''):''}</g>`}).join('')}</svg>`}
function renderSVG(){$('stage').innerHTML=svgMarkup();let svg=$('svg');svg.onpointerdown=e=>{let g=e.target.closest('[data-id]');if(!g)return;selected=Number(g.dataset.id);let pt=point(e,svg),s=screen();drag={dx:pt.x-s.x,dy:pt.y-s.y};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;let pt=point(e,svg),s=screen();s.x=Math.max(0,Math.min(100000,Math.round((pt.x-drag.dx)/50)*50));s.y=Math.max(0,Math.min(100000,Math.round((pt.y-drag.dy)/50)*50));svg.querySelector(`[data-id="${s.id}"]`).setAttribute('transform',`translate(${s.x},${s.y})`)};svg.onpointerup=svg.onpointercancel=()=>{if(drag){drag=null;save();draw()}}}function point(e,svg){return new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse())}
function download(data,name,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download(JSON.stringify(p,null,2),'ledplanner-project.json','application/json')}function csv(){let q=v=>'"'+String(v).replace(/"/g,'""')+'"';download('\ufeff'+[['Layar','Kabinet','Lebar mm','Tinggi mm','Lebar px','Tinggi px','Daya maks W'],...p.screens.map(s=>[ /^[=+@-]/.test(s.name)?"'"+s.name:s.name,s.cols*s.rows,s.cols*s.w,s.rows*s.h,s.cols*s.pw,s.rows*s.ph,s.cols*s.rows*s.watts])].map(r=>r.map(q).join(',')).join('\r\n'),'ledplanner-equipment.csv','text/csv;charset=utf-8')}
function png(){let img=new Image(),u=URL.createObjectURL(new Blob([svgMarkup()],{type:'image/svg+xml'}));img.onload=()=>{let c=document.createElement('canvas');c.width=2400;c.height=Math.round(2400*img.height/img.width)||1400;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(b)download(b,'ledplanner-layout.png','image/png')});URL.revokeObjectURL(u)};img.onerror=()=>{URL.revokeObjectURL(u);toast('Gagal membuat PNG')};img.src=u}
$('file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>2e6)throw Error();let v=JSON.parse(await f.text());if(!valid(v))throw Error();if(!confirm('Ganti proyek aktif dengan file ini?'))return;p=v;selected=p.screens[0]?.id;save();draw();toast('Proyek berhasil diimpor')}catch{toast('File proyek tidak valid atau terlalu besar')}e.target.value=''};draw();
</script></html>
