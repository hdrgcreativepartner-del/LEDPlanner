[package]
name = "ledplanner"
version = "1.0.1"
description = "LED Planner desktop shell"
authors = ["HDRG Creative Partner"]
edition = "2021"

[lib]
name = "ledplanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rfd = "0.17"
